# ----------------------------------------------------------------------
#  TUTORIAL (/tutorial oppure /bm tutorial)
#  Denny e Andrew sono NPC "a cubi" con le animazioni del rig (nessun plugin extra).
#  Il trailer (scena con audio e sottotitoli) non c'e' ancora: arriva con gli audio dei due personaggi.
#    /tutorial npc [denny|andrew]      mette gli NPC dove ti trovi (guardano verso di te)
#    /tutorial npcremove [nome]        li toglie
#    /tutorial anim <nome|all> <anim>  prova un'animazione (/tutorial clips le elenca)
#  Le posizioni stanno in tutorial-data.yml (non toccarlo a mano).
#  Distanze: nel config.yml  npc.look-range (guardano chi e' vicino) e npc.greet-range (salutano).
# ----------------------------------------------------------------------
