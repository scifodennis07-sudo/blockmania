# ----------------------------------------------------------------------
#  TUTORIAL  (/tutorial  oppure  /bm tutorial)
#  Il giocatore resta fermo e la sua visuale segue chi parla, a tempo con l'audio.
#  Come si prepara (una volta sola, in gioco, da admin):
#    1. Vai dove deve stare il giocatore, guarda verso il centro e scrivi  /tutorial setspot
#    2. Mettiti dove deve stare Denny e scrivi  /tutorial setpoint denny   (stessa cosa per andrew)
#    3. Mettiti in mezzo ai due e scrivi  /tutorial setpoint center
#    4. Scrivi  /tutorial npc  per creare Denny e Andrew (/tutorial npcremove li toglie)
#       Cambia la skin con  /tutorial skin <denny|andrew> <nomeGiocatore>
#       Serve il plugin packetevents (gli NPC sono giocatori veri fatti con i pacchetti)
#    5. Prova con  /tutorial   (salta con  /tutorial skip,  controlla con  /tutorial info)
#  Per rifare: /tutorial resetspot, /tutorial resetpoint <denny|andrew|center|all>
#  Spot, punti e NPC stanno in tutorial-data.yml (non toccarlo a mano).
# ----------------------------------------------------------------------
config-version: 5
sound:
  name: "tutorial1"          # il suono del resource pack (playsound tutorial1)
  volume: 1.0
  pitch: 1.0

auto-start: true             # parte da solo quando entra chi non l'ha mai visto
auto-start-delay: 80         # tick (20 = 1 secondo) dopo l'ingresso
subtitles: true              # sottotitoli nella actionbar con lo sfondo, restano finche' non parla l'altro

camera:
  sway: 0.8                  # oscillazione leggera della testa (0 = niente)

# Denny e Andrew sono giocatori veri (skin completa) fatti con packetevents. Si creano con  /tutorial npc
npc:
  talk-gestures: true        # chi parla muove il braccio ogni tanto
  y-offset: 0                # se gli NPC sembrano troppo alti o bassi (es. -0.1), poi rifai /tutorial npc
  view-distance: 48          # da quanti blocchi si vedono
  denny:
    name: "Denny"
    skin: "doppiaX"          # nome del giocatore di cui prende la skin (cambiala con /tutorial skin denny NOME)
  andrew:
    name: "Andrew"
    skin: "zCrqck_"

scene:
  length: 72.4               # durata in secondi (uguale all'audio)
  return-after: true         # alla fine riporta il giocatore dov'era
  start-away: 120            # all'inizio il giocatore guarda questi gradi lontano dagli NPC (0 = niente)
  avoid-margin: 30           # gradi di margine: quando si guarda in giro non si guarda mai gli NPC
  # ogni passo:  at = secondo, look = punto da guardare (denny/andrew/center, oppure away:GRADI[,INCLINAZIONE]
  # per guardare in giro: + dal lato di Denny, - dal lato di Andrew, mai verso di loro), turn = secondi che impiega a girarsi,
  # speaker = chi parla (serve solo quando look e' away), text = sottotitolo (resta finche' non c'e' un altro testo; text: \"\" lo toglie),
  # do = gesti degli NPC (swing = muove il braccio, wave = saluta, hop = saltello, pat = pacca sulla spalla all'altro, bump = pugno tra i due, step = passo verso il giocatore, nod = si', shake = no, eat = mano alla bocca col gomito piegato, block = braccio alzato, crouch = si abbassa), commands = comandi console (%player% = il giocatore)
  steps:
    - {at: 0.00, look: "away:120", turn: 0.1, speaker: denny}
    - {at: 0.08, text: "&bDenny&7: Ehi, ciao? ... Ehi?", do: ["denny:wave"]}
    - {at: 0.55, look: "away:-110,-6", turn: 1.0, speaker: denny}
    - {at: 1.15, look: "away:110,8", turn: 0.9, speaker: denny}
    - {at: 1.60, look: "away:75,-3", turn: 0.6, speaker: andrew}
    - {at: 1.88, text: "&cAndrew&7: Ma questo è cieco?", do: ["andrew:shake"]}
    - {at: 3.58, look: denny, turn: 0.35}
    - {at: 3.83, text: "&bDenny&7: Eh? ... Ah, eccoti!", do: ["denny:wave", "denny:hop"]}
    - {at: 5.83, look: andrew, turn: 0.35}
    - {at: 6.08, text: "&cAndrew&7: Siamo qui! Davanti a te!", do: ["andrew:swing", "andrew:crouch"]}
    - {at: 8.35, look: denny, turn: 0.35}
    - {at: 8.60, text: "&bDenny&7: Sono qui! Guardami... ahah!", do: ["denny:swing", "denny:hop"]}
    - {at: 10.42, look: andrew, turn: 0.35}
    - {at: 10.67, text: "&cAndrew&7: Che ridere. Davvero. Sto morendo.", do: ["andrew:shake"]}
    - {at: 11.50, do: ["andrew:swing"]}
    - {at: 13.23, look: denny, turn: 0.35}
    - {at: 13.48, text: "&bDenny&7: Lascia perdere Andrew, fa così con tutti quelli nuovi. Bene! Ti do il benvenuto su BlockMania.", do: ["denny:shake"]}
    - {at: 14.20, do: ["denny:pat"]}
    - {at: 18.54, look: andrew, turn: 0.35}
    - {at: 18.79, text: "&cAndrew&7: Sì sì, benvenuto. Non toccare niente senza chiedere.", do: ["andrew:swing", "andrew:crouch"]}
    - {at: 20.50, do: ["andrew:crouch"]}
    - {at: 22.33, look: denny, turn: 0.35}
    - {at: 22.58, text: "&bDenny&7: Ma dai, Andrew! Lascialo respirare! Ah, scusa, che maleducato... non mi sono nemmeno presentato. Io sono Denny, piacere!", do: ["denny:wave"]}
    - {at: 27.00, do: ["denny:step"]}
    - {at: 29.75, look: andrew, turn: 0.35}
    - {at: 30.00, text: "&cAndrew&7: Bravo, Denny. Dopo dieci secondi. Un record.", do: ["andrew:shake"]}
    - {at: 31.50, do: ["andrew:swing"]}
    - {at: 32.92, look: denny, turn: 0.35}
    - {at: 33.17, text: "&bDenny&7: Se continui così ti presento io come \"quello simpatico\".", do: ["denny:nod"]}
    - {at: 35.30, do: ["denny:hop"]}
    - {at: 36.51, look: andrew, turn: 0.35}
    - {at: 36.76, text: "&cAndrew&7: E io sono Andrew. Purtroppo.", do: ["andrew:crouch", "andrew:swing"]}
    - {at: 38.64, look: denny, turn: 0.35}
    - {at: 38.89, text: "&bDenny&7: Sarò io il tuo tutor: ti guiderò qui nel server. Ti spiegherò come iniziare, come muoverti, e qualche strategia che ti farà risparmiare un sacco di tempo.", do: ["denny:nod"]}
    - {at: 40.60, do: ["denny:step"]}
    - {at: 45.00, do: ["denny:wave"]}
    - {at: 47.84, look: andrew, turn: 0.35}
    - {at: 48.09, text: "&cAndrew&7: Io intanto ti guardo. Giusto per essere sicuro che non rompi niente.", do: ["andrew:swing"]}
    - {at: 50.00, do: ["andrew:swing"]}
    - {at: 52.55, look: denny, turn: 0.35}
    - {at: 52.80, text: "&bDenny&7: Non ci far caso. In realtà è un tenerone.", do: ["denny:nod"]}
    - {at: 54.40, do: ["denny:pat"]}
    - {at: 55.94, look: andrew, turn: 0.35}
    - {at: 56.19, text: "&cAndrew&7: Ripetilo e me ne vado.", do: ["andrew:shake"]}
    - {at: 58.97, look: denny, turn: 0.35}
    - {at: 59.22, text: "&bDenny&7: Allora... sei pronto?", do: ["denny:nod"]}
    - {at: 60.55, look: andrew, turn: 0.35}
    - {at: 60.80, text: "&cAndrew&7: Ma figurati, no. Guarda che faccia.", do: ["andrew:shake", "andrew:crouch"]}
    - {at: 61.90, do: ["andrew:crouch"]}
    - {at: 63.13, look: denny, turn: 0.35}
    - {at: 63.38, text: "&bDenny&7: Beh... che domanda stupida! Se sei qui, vuol dire che sei nato pronto. Andiamo, allora!", do: ["denny:wave", "denny:hop"]}
    - {at: 66.40, do: ["denny:bump"]}
    - {at: 68.86, look: andrew, turn: 0.35}
    - {at: 69.11, text: "&cAndrew&7: ...Che pazienza. Andiamo.", do: ["andrew:shake"]}
    - {at: 71.85, look: center, turn: 1.0, text: "", speaker: ""}

messages:
  usage-offset: "&c/tutorial offset <secondi>  (positivo = scena piu' tardi, negativo = piu' presto)"
  offset-now: "&7offset attuale: &f%value%&7 secondi"
  offset-set: "&aoffset impostato a %value% secondi: riprova con /tutorial"
  no-packetevents: "&cmanca il plugin packetevents: mettilo nella cartella plugins e riavvia"
  usage-skin: "&c/tutorial skin <denny|andrew> <nomeGiocatore>"
  skin-loading: "&7cerco la skin di &f%skin%&7..."
  skin-set: "&askin di %name% impostata: &f%skin%"
  skin-error: "&cnon trovo la skin di %skin% (nome sbagliato o Mojang non risponde)"
  start: "&7tutorial in partenza... &8(scrivi &f/tutorial skip&8 per saltarlo)"
  end: "&atutorial finito, buon divertimento!"
  skipped: "&7tutorial saltato"
  blocked: "&cdurante il tutorial puoi usare solo /tutorial skip"
  not-running: "&cnon stai guardando nessun tutorial"
  no-permission: "&cnon puoi farlo"
  unknown-player: "&cgiocatore non trovato"
  reset: "&atutorial azzerato per %player%: lo rivedra' al prossimo ingresso"
  spot-saved: "&aposizione del giocatore salvata"
  point-saved: "&apunto &f%name% &asalvato"
  usage-setpoint: "&c/tutorial setpoint <denny|andrew|center>"
  usage-resetpoint: "&c/tutorial resetpoint <denny|andrew|center|all>"
  spot-reset: "&aposizione del giocatore azzerata (rifai /tutorial setspot)"
  point-reset: "&apunto &f%name% &aazzerato"
  info-title: "&eStato del tutorial:"
  info-line: "&7%name%: %state%"
  usage: "&c/tutorial [skip|play|reset|setspot|resetspot|setpoint|resetpoint|info|npc|npcremove|reload]"
  reloaded: "&aconfig ricaricato"
  npc-removed: "&aNPC rimossi: %count%"
  npc-nopoint: "&cmanca il punto %name%: usa prima /tutorial setpoint %name%"
  npc-exists: "&e%name% esiste gia'"
  npc-created: "&a%name% creato"
