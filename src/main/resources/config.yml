# ======================================================================
#  BlockMania - configurazione
#  Dopo aver cambiato qualcosa usa  /blockmania reload
#
#  - Scrivi i testi normalmente: il plugin li trasforma da solo in tiny text
#    (i numeri, i simboli e i codici colore restano uguali).
#  - Colori: &a &c &7 ... e anche esadecimali  &#ff8800
#  - Gli oggetti che hai gia' in inventario vanno richiesti di nuovo
#    se cambi nome, lore o custom-model-data.
# ======================================================================

config-version: 2   # non toccare: serve al plugin per aggiornare il config

# true = tutte le scritte in tiny text. false = scritte normali.
tiny-text: true

# Cosa compare quando si preme TAB al posto di un numero
tab:
  number: "<numero>"
  block-codes: ["1-1", "2-1", "3-1"]   # esempi di codici blocco suggeriti con TAB in /bm block ...

# ----------------------------------------------------------------------
#  STILI DEI MESSAGGI
#  Ogni messaggio ha un "type" che sceglie lo stile qui sotto.
#    color     colore del testo
#    highlight colore dei valori (nomi, numeri) dentro al messaggio
#    prefix    testo messo PRIMA del messaggio (vuoto = niente)
#    suffix    testo messo DOPO il messaggio
#    uniform   true = tutto il messaggio (anche i valori) ha lo stesso colore
# ----------------------------------------------------------------------
styles:
  error:
    color: "&c"
    highlight: "&f"
    prefix: ""
    suffix: ""
    uniform: true
  success:
    color: "&a"
    highlight: "&f"
    prefix: ""
    suffix: ""
  info:
    color: "&7"
    highlight: "&f"
    prefix: ""
    suffix: ""
  warning:
    color: "&e"
    highlight: "&f"
    prefix: ""
    suffix: ""

# ----------------------------------------------------------------------
#  PALETTE: i tuoi colori al posto di quelli classici di Minecraft
#  Ogni colore ha due valori (inizio e fine): il testo di quel colore diventa una
#  leggera sfumatura. Metti due volte lo stesso valore per un colore pieno.
#  Funziona ovunque (messaggi, lore, bossbar...) dove scrivi i codici:
#    &c rosso  &a verde  &e giallo  &b azzurro  &9 blu  &6 oro  &7 grigio ...
#  Il bianco (&f) resta bianco vero: serve per gli sfondi disegnati.
#  Colori disponibili: black dark_blue dark_green dark_aqua dark_red dark_purple gold gray
#                      dark_gray blue green aqua red light_purple yellow white
#  Per spegnere tutto: enabled: false
# ----------------------------------------------------------------------
palette:
  enabled: true
  colors:
    dark_blue: ["#3F51D6", "#2A32A8"]
    dark_green: ["#2FA84F", "#1F7A3A"]
    dark_aqua: ["#35C4C4", "#238DA6"]
    dark_red: ["#D63A3A", "#A32232"]
    dark_purple: ["#B04CE0", "#7B2FB5"]
    gold: ["#FFC247", "#FF9A2E"]
    gray: ["#C4C8D4", "#9EA3B3"]
    dark_gray: ["#7A7F8E", "#565A68"]
    blue: ["#54DAF4", "#4C7DD7"]
    green: ["#7DF28A", "#3FD061"]
    aqua: ["#6FF0F0", "#3CC0E8"]
    red: ["#FF7A7A", "#E5384F"]
    light_purple: ["#FF9AF5", "#D95CE8"]
    yellow: ["#FFF27A", "#FFCB3D"]

# ----------------------------------------------------------------------
#  MESSAGGI MENTRE HAI UNA GUI APERTA
#  L'actionbar con una GUI aperta e' coperta: il messaggio compare in una bossbar.
# ----------------------------------------------------------------------
gui-messages:
  seconds: 3

# ----------------------------------------------------------------------
#  NUMERI DISEGNATI (nel pack, in font/default.json)
#  Ogni set e' fatto da 11 caratteri di fila: le cifre 0-9 e la barra "/".
#  Scrivi qui il PRIMO carattere (quello dello 0). Gli "-shadow" sono le ombre.
#    main    numeri orizzontali (1/2)
#    top     numero in alto nelle colonne verticali    bottom  numero in basso
# ----------------------------------------------------------------------
glyphs:
  main: "\uE400"
  main-shadow: "\uE410"
  top: "\uE420"
  top-shadow: "\uE430"
  bottom: "\uE440"
  bottom-shadow: "\uE450"
  shadow-color: "#3F3F3F"     # colore dell'ombra dei numeri

# ----------------------------------------------------------------------
#  MESSAGGI
#    type     error / success / info / warning (oppure uno stile tuo qui sopra)
#    channel  chat = in chat, actionbar = sopra l'hotbar
#    text     il testo (una riga, oppure una lista di righe)
#  Segnaposto: %value% = quello che il giocatore ha scritto, %usage% = come si usa
#  il comando, e altri indicati caso per caso.
