# ----------------------------------------------------------------------
#  /blockmania help  (sempre in chat)
#  Ogni comando ha: usage (come si scrive), description, example e permission
#  (chi non ha il permesso non vede quel comando). usage viene usato anche
#  nei messaggi di errore.
# ----------------------------------------------------------------------
help:
  header: "&6&lblockmania &8- &7guida ai comandi"
  usage-line: "&e%usage%"
  description-line: "&8  » &7%description%"
  example-line: "&8  » &7esempio: &f%example%"
  footer: "&8<> = obbligatorio, [] = facoltativo, se non scrivi il player vale per te"
  commands:
    get:
      permission: blockmania.get
      usage: "/bm get <oggetto> [player]"
      description: "ti da un oggetto, come il lanciapalle. se scrivi un player lo da a lui"
      example: "/bm get lanciapalle"
    block:
      permission: blockmania.get
      usage: "/bm block <get|wand|pos1|pos2|set|replace|remove|undo> ..."
      description: "blocchi custom. get <codice> [player] ti da un blocco. Con la bacchetta (wand) scegli due angoli (o pos1/pos2), poi set <codice> riempie la zona, replace <da> <a> sostituisce, remove [codice] toglie, undo annulla"
      example: "/bm block set 3-1"
    ball:
      permission: blockmania.stats
      usage: "/bm ball <get|remove|see|reset> <tipo|all> [numero] [player]"
      description: "gestisce le palle: get ne aggiunge, remove ne toglie, see le mostra, reset le azzera. all vale per tutti i tipi"
      example: "/bm ball get standardball 20"
    blockshell:
      permission: blockmania.stats
      usage: "/bm blockshell <get|remove|see|reset> [numero] [player]"
      description: "gestisce le blockshell (hanno un massimo). get ne aggiunge, remove ne toglie, see le mostra, reset le azzera"
      example: "/bm blockshell remove 3"
    blockcoin:
      permission: blockmania.stats
      usage: "/bm blockcoin <get|remove|see|reset> [numero] [player]"
      description: "gestisce i blockcoin (nessun limite). get ne aggiunge, remove ne toglie, see li mostra, reset li azzera"
      example: "/bm blockcoin see doppiax"
    power:
      permission: blockmania.stats
      usage: "/bm power <give|see|reset|set <n>|uses <n>> [player]"
      description: "give = regala gli attacchi di uno sblocco, set <n> = imposta quanti ne ha pronti, uses <n> = quanti ne regala ogni sblocco, see = mostra, reset = azzera"
      example: "/bm power give"
    mines:
      permission: blockmania.build
      usage: "/bm mines <wand|pos1|pos2|set|replace|remove|undo|createmines <n>|deletemines <n>|changemines <n>|editmines <n>|area [n]|list>"
      description: "costruzione delle miniere. wand/pos1/pos2/set/replace/remove/undo come /bm block. createmines n = la zona scelta diventa la miniera n, deletemines n = la elimina, changemines n = la sostituisce, area = il mondo staff con tutte le miniere insieme, editmines n = ti porta nella miniera n per modificarla (shift + F salva, shift + Q annulla)"
      example: "/bm mines createmines 1"
    stamina:
      permission: blockmania.stats
      usage: "/bm stamina <see|refill|empty|set <0-100>|infinite|locked|normal> [player]"
      description: "see = mostra, refill = piena subito, empty = svuotata (si ricarica), set = percentuale, infinite = sempre piena, locked = sempre vuota, normal = torna normale"
      example: "/bm stamina infinite"
    limits:
      permission: blockmania.limits
      usage: "/bm limits <on|off|see> [player]"
      description: "off = togli le limitazioni (livelli senza tetto di miniera, attacco potenziato sempre pronto), on = rimetti"
      example: "/bm limits off"
    mine:
      permission: blockmania.stats
      usage: "/bm mine <get|remove|see|reset> [numero] [player]"
      description: "gestisce la miniera del giocatore (parte da 1). Decide fino a che livello puo potenziare"
      example: "/bm mine get 1"
    items:
      permission: blockmania.get
      usage: "/bm items [player]"
      description: "apre la lista di tutti gli oggetti custom: clicca per riceverli"
      example: "/bm items"
    upgrade:
      permission: blockmania.stats
      usage: "/bm upgrade <get|remove|see|reset> <potenziamento|all> [numero] [player]"
      description: "cambia il livello dei potenziamenti di un giocatore"
      example: "/bm upgrade get damage 2"
    resetall:
      permission: blockmania.stats
      usage: "/bm resetall [player]"
      description: "resetta tutto a un giocatore: palle, coin, blockcoin, blockshell, miniera e potenziamenti"
      example: "/bm resetall Dennis"
    coin:
      permission: blockmania.stats
      usage: "/bm coin <get|remove|see|reset> [numero] [player]"
      description: "gestisce i coin (nessun limite), la valuta dei potenziamenti. get ne aggiunge, remove ne toglie, see li mostra, reset li azzera"
      example: "/bm coin get 100"
    shop:
      permission: blockmania.shop.edit
      usage: "/bm shop <ammo|doubleball|ghostball|explosionball|sell> [player]"
      description: "ti da la piuma per piazzare un negozio: uno per ogni palla (ammo = standardball) e sell per vendere le blockshell"
      example: "/bm shop ammo"
    bgtest:
      permission: blockmania.reload
      usage: "/bm bgtest [testo]"
      description: "mostra un testo nella actionbar con lo sfondo, per controllare che sia centrato"
      example: "/bm bgtest coin 25"
    reload:
      permission: blockmania.reload
      usage: "/bm reload"
      description: "ricarica il config senza riavviare il server"
      example: ""
    help:
      permission: ""
      usage: "/bm help"
      description: "mostra questa guida"
      example: ""

# ----------------------------------------------------------------------
#  OGGETTI
#  Ogni voce e' un oggetto che si ottiene con  /blockmania get <nome-voce>
#  (scrivi il nome della voce in minuscolo)
#  Segnaposto per name e lore: %damage% %speed% %cooldown% %ammo%
#  (i valori mostrano gia' i potenziamenti del giocatore)
# ----------------------------------------------------------------------
items:
  lanciapalle:
    material: STICK            # tipo di oggetto (STICK, BLAZE_ROD, FEATHER, ...)
    custom-model-data: 1       # modello normale nel resource pack
    aim-custom-model-data: 2   # modello mentre tieni premuto shift (sembra che miri)
    projectile-custom-model-data: 1   # modello della palla lanciata (togli la riga = palla normale)
    projectile-material: SNOWBALL     # item usato per il modello della palla lanciata
    name: "&b&lLanciapalle"
    lore:
      - ""
      - "&7spara palle di neve contro i blocchi"
      - "&7per indebolirli e distruggerli"
      - ""
      - "&8• &7danno &c%damage%"
      - "&8• &7velocita &b%speed%"
      - "&8• &7ricarica &e%cooldown%s"
      - "&8• &7munizioni &f%ammo%"
      - ""
      - "&6tasto destro &7spara"
      - "&6f &7cambia palla"
      - "&6sinistro &7apre i potenziamenti"
    speed: 1.5                 # velocita' base della palla (quella normale e' 1.5)
    cooldown: 0.5              # secondi base tra uno sparo e l'altro
    ammo: standardball         # che tipo di palle consuma (vedi "ammo")
    sound: "entity.snowball.throw"   # suono dello sparo (vuoto = nessun suono)
    volume: 0.5
    pitch: 0.4

# ----------------------------------------------------------------------
#  RIMBALZO: le palle del lanciapalle rimbalzano contro i blocchi
#  e dopo "max" rimbalzi spariscono.
# ----------------------------------------------------------------------
bounce:
  enabled: true
  max: 3                       # quanti rimbalzi prima di sparire
  speed-keep: 0.8              # velocita' mantenuta a ogni rimbalzo (1 = nessuna perdita)
  sound: "entity.slime.squish_small"   # suono del rimbalzo (vuoto = nessuno)
  volume: 0.4
  pitch: 1.5

# ----------------------------------------------------------------------
#  PALLE (virtuali: sono un numero per giocatore, non oggetti)
#    /blockmania ball get standardball 20
# ----------------------------------------------------------------------
ammo:
  # ogni tipo e' una voce. Con il lanciapalle in mano il tasto F passa al tipo dopo (nell'ordine di questa lista).
  # Per ogni palla:
  #   damage                          vita che toglie a un blocco (ogni palla successiva fa di piu')
  #   max                             quante se ne possono avere (il potenziamento di capienza lo aumenta)
  #   projectile-custom-model-data    modello della palla lanciata (items/snowball.json nel pack)
  #   bounce                          false = non rimbalza
  #   shots / shot-delay-ticks        quante palle per sparo e ogni quanti tick (20 tick = 1 secondo)
  #   grid / grid-spacing             griglia di palle parallele (3 = 3x3 = 9 palle) e distanza tra loro in blocchi
  #   ghost / range                   passa attraverso i blocchi e fa danno a tutti quelli che attraversa
  standardball:
    damage: 50                 # vita base che toglie a un blocco quando lo colpisce
    max: 20                    # massimo di palle che si possono avere (0/20)
    projectile-custom-model-data: 1
  doubleball:
    damage: 75
    max: 15
    projectile-custom-model-data: 2
    shots: 2                   # lancia 2 palle una dopo l'altra
    shot-delay-ticks: 2        # con 2 tick di distanza
  ghostball:
    damage: 100
    max: 10
    projectile-custom-model-data: 3
    ghost: true                # attraversa i blocchi e li danneggia tutti (non rimbalza)
    range: 40                  # distanza massima in blocchi
    fire-sounds:               # suoni quando la spari (ognuno con sound / volume / pitch, ne puoi aggiungere o togliere)
      whoosh:
        sound: "entity.vex.charge"
        volume: 1.2
        pitch: 1.5
      shimmer:
        sound: "block.amethyst_block.resonate"
        volume: 1.0
        pitch: 0.7
  explosionball:
    damage: 150
    max: 6
    projectile-custom-model-data: 4
    grid: 3                    # 3x3 = 9 palle parallele, colpiscono 3x3 blocchi
    grid-spacing: 1.0          # distanza tra le palle in blocchi
    explosion: true            # il primo urto di ogni palla esplode (i rimbalzi no)
    fire-sounds:
      launch:
        sound: "entity.firework_rocket.launch"
        volume: 1.2
        pitch: 0.8
      thump:
        sound: "entity.blaze.shoot"
        volume: 0.8
        pitch: 0.7

# suono del cambio palla (tasto F)
ball-switch:
  sound: "ui.button.click"
  volume: 0.6
  pitch: 1.6

# ----------------------------------------------------------------------
#  SPARO AUTOMATICO: tenendo premuto il tasto destro il lanciapalle spara da solo,
#  alla velocita' della ricarica (con i potenziamenti). Non serve cliccare a raffica.
#  grace-ticks: dopo quanti tick senza click smette (5 = un quarto di secondo)
# ----------------------------------------------------------------------
autofire:
  enabled: true
  grace-ticks: 5

# ----------------------------------------------------------------------
#  BACCHETTA (/bm block wand): scegli due angoli (sinistro = pos1, destro = pos2)
#  e poi /bm block set | replace | remove riempie, sostituisce o toglie i blocchi custom.
#  Si puo' annullare con /bm block undo. Serve il permesso blockmania.build
# ----------------------------------------------------------------------
blockwand:
  material: STICK
  name: "&6&lbacchetta BlockMania"
  lore:
    - ""
    - "&6sinistro &7sceglie pos1"
    - "&6destro &7sceglie pos2"
    - "&7poi /bm block set <codice>"
  custom-model-data: 0         # 0 = nessuno
  max-blocks: 200000           # zona piu' grande che si puo' modificare in un colpo
  blocks-per-tick: 4000        # blocchi fatti ogni tick (piu' basso = meno lag, ma piu' lento)
  undo-steps: 5                # quante modifiche si possono annullare

# ----------------------------------------------------------------------
#  BLOCKSHELL: +1 per ogni blocco distrutto. Al massimo non si possono
#  distruggere altri blocchi: si possono solo indebolire (l'ultimo colpo non fa danno).
#  BLOCKCOIN: +1 per ogni blocco distrutto, senza limite.
#  COIN: si guadagnano vendendo le blockshell al negozio (o con il comando).
# ----------------------------------------------------------------------
blockshell:
  max: 10

rewards:
  blockshell: 1
  blockcoin: 1

# ----------------------------------------------------------------------
#  VALORE DELLE SHELL IN COIN (in base al livello del blocco rotto: 1-1 = lv1, 2-1 = lv2 ...)
#    first      quanto vale una shell di lv1
#    step       dal lv2 in poi vale (livello-1) * step  ->  lv2=5, lv3=10, lv4=15...
#    overrides  per forzare un livello, ad esempio  7: 100
#    command-level  livello delle shell create con /bm blockshell get
# ----------------------------------------------------------------------
shells:
  command-level: 1
  values:
    first: 1
    step: 5
    overrides: {}

# ----------------------------------------------------------------------
#  NEGOZI (armor stand invisibili con una piuma in testa)
#  /bm shop ammo  e  /bm shop sell ti danno una piuma: piazzala per creare il negozio.
#  Per toglierlo: shift + tasto destro a mano vuota (e' permesso solo a chi ha blockmania.shop.edit).
#  Segnaposto ologramma: %price% %currency% %balance% %ammo% %ammo_max% %shells% %coins%
# ----------------------------------------------------------------------
shops:
  # a ogni miniera sbloccata il prezzo delle palle (tranne la standardball) viene moltiplicato per questo numero.
  # Resta alto anche se il giocatore torna indietro di miniera. 1.35 = +35% a miniera. Si puo' cambiare un negozio
  # solo con shops.<nome>.mine-growth (1.0 = il prezzo non sale)
  mine-price-growth: 1.35
  ammo:
    material: FEATHER
    custom-model-data: 1
    item:                      # la piuma che si ottiene con /bm shop ammo
      name: "&e&lnegozio palle"
      lore:
        - ""
        - "&7piazzala per creare il negozio delle palle"
        - "&8shift + destro a mano vuota per toglierlo"
    ammo-type: standardball    # che palle riempie
    currency: coin             # cosa si paga: coin, blockcoin oppure blockshell
    price: 10                  # prezzo per riempire la capienza base (con la capienza potenziata si paga in proporzione alle palle che mancano)
    hologram:
      - "&e&lnegozio palle"
      - "&7clicca per acquistare per &e%price% %currency%"
      - "&8palle &f%ammo%&8/&f%ammo_max%"
    sounds:
      buy:
        sound: "entity.experience_orb.pickup"
        volume: 0.8
        pitch: 1.2
      error:
        sound: "entity.villager.no"
        volume: 0.8
        pitch: 1.0
  doubleball:
    material: FEATHER
    custom-model-data: 2
    item:                      # la piuma che si ottiene con /bm shop doubleball
      name: "&b&lnegozio doubleball"
      lore:
        - ""
        - "&7piazzala per creare il negozio di doubleball"
        - "&8shift + destro a mano vuota per toglierlo"
    ammo-type: doubleball
    currency: coin
    price: 60
    hologram:
      - "&b&lnegozio doubleball"
      - "&7clicca per acquistare per &e%price% %currency%"
      - "&8palle &f%ammo%&8/&f%ammo_max%"
    sounds:
      buy:
        sound: "entity.experience_orb.pickup"
        volume: 0.8
        pitch: 1.2
      error:
        sound: "entity.villager.no"
        volume: 0.8
        pitch: 1.0
  ghostball:
    material: FEATHER
    custom-model-data: 3
    item:                      # la piuma che si ottiene con /bm shop ghostball
      name: "&d&lnegozio ghostball"
      lore:
        - ""
        - "&7piazzala per creare il negozio di ghostball"
        - "&8shift + destro a mano vuota per toglierlo"
    ammo-type: ghostball
    currency: coin
    price: 250
    hologram:
      - "&d&lnegozio ghostball"
      - "&7clicca per acquistare per &e%price% %currency%"
      - "&8palle &f%ammo%&8/&f%ammo_max%"
    sounds:
      buy:
        sound: "entity.experience_orb.pickup"
        volume: 0.8
        pitch: 1.2
      error:
        sound: "entity.villager.no"
        volume: 0.8
        pitch: 1.0
  explosionball:
    material: FEATHER
    custom-model-data: 4
    item:                      # la piuma che si ottiene con /bm shop explosionball
      name: "&c&lnegozio explosionball"
      lore:
        - ""
        - "&7piazzala per creare il negozio di explosionball"
        - "&8shift + destro a mano vuota per toglierlo"
    ammo-type: explosionball
    currency: coin
    price: 800
    hologram:
      - "&c&lnegozio explosionball"
      - "&7clicca per acquistare per &e%price% %currency%"
      - "&8palle &f%ammo%&8/&f%ammo_max%"
    sounds:
      buy:
        sound: "entity.experience_orb.pickup"
        volume: 0.8
        pitch: 1.2
      error:
        sound: "entity.villager.no"
        volume: 0.8
        pitch: 1.0
  sell:
    material: FEATHER
    custom-model-data: 6
    item:                      # la piuma che si ottiene con /bm shop sell
      name: "&6&lvendita blockshell"
      lore:
        - ""
        - "&7piazzala per creare il negozio di vendita"
        - "&8shift + destro a mano vuota per toglierlo"
    seconds-per-shell: 0.2     # tempo per vendere ogni shell
    move-tolerance: 0.15       # se ti muovi di piu di cosi (in blocchi) la vendita si annulla: devi stare fermo
    max-distance: 6            # non piu usato
    hologram:
      - "&6&lvendita blockshell"
      - "&7tasto destro per vendere le tue blockshell"
      - "&8hai &f%shells% &8shell, valgono &e%coins% coin"
    bossbar:
      # Ogni livello di shell ha il suo riquadro. Segnaposto di group-format:
      #   %count% quante shell di quel livello  %level% il livello
      #   %coins% quanto vale UNA shell di quel livello  %group_total% valore di tutte quelle del livello
      group-format: "&fx%count% &7lv%level% &e%coins% coin"
      title: ""                # riquadro iniziale facoltativo, ad esempio "&7vendita" (vuoto = nessuno)
      color: GREEN
      style: PROGRESS
      progress-bar: true       # true = disegna la barra sotto lo sfondo (serve bossbar.json aggiornato)
      bar-width: 182           # larghezza della barra in pixel (182 = come una bossbar normale)
    sounds:
      tick:
        sound: "block.note_block.hat"
        volume: 0.5
        pitch: 1.6
      done:
        sound: "entity.player.levelup"
        volume: 0.8
        pitch: 1.5

# Ologramma sopra lo stand (compare solo a chi lo guarda)
hologram:
  range: 5                     # da quanti blocchi si vede
  height: 2.4                  # altezza sopra lo stand
  update-ticks: 5              # ogni quanti tick si aggiorna (20 tick = 1 secondo)

# ----------------------------------------------------------------------
#  BOSSBAR (la barra in alto, sempre piena)
#  Segnaposto: %ammo% %ammo_max% %shell% %shell_max% %blockcoin% %coin%
# ----------------------------------------------------------------------
bossbar:
  enabled: true
  always-visible: true         # false = visibile solo con il lanciapalle in mano
  ammo-type: standardball      # tipo di palla mostrato se il giocatore non ne ha scelto uno. Scrivi %ball% nel testo per il nome
  # un riquadro (sfondo) per ogni voce della lista. Aggiungi, togli o cambia le righe come vuoi
  segments:
    - "&b%ball%: &f%ammo%&8/&f%ammo_max%"
    - "&6blockshell: &f%shell%/%shell_max%"
    - "&eblockcoin: &f%blockcoin%"
    - "&acoin: &f%coin%"
  text: "&bstandardball: &f%ammo%&8/&f%ammo_max% &8| &6blockshell: &f%shell%/%shell_max% &8| &eblockcoin: &f%blockcoin% &8| &acoin: &f%coin%"   # usato solo se segments e' vuoto
  font: ""                     # font del pack per abbassare il testo, ad esempio "minecraft:bossbar"
                               # (vuoto = font normale). Attivalo solo dopo aver messo bossbar.json nel pack
  color: BLUE                  # PINK BLUE RED GREEN YELLOW PURPLE WHITE
  style: PROGRESS              # PROGRESS NOTCHED_6 NOTCHED_10 NOTCHED_12 NOTCHED_20

# ----------------------------------------------------------------------
#  POTENZIAMENTI (tasto sinistro con il lanciapalle, senza shift)
#  I livelli sono del giocatore e valgono per tutti i suoi lanciapalle.
#  Per ogni potenziamento:
#    label          nome mostrato          max-level      livello massimo in assoluto
#    per-level      quanto cambia a livello
#    cost-base      costo del livello 1    cost-increase  quanto sale il costo a ogni livello
#    costs          (facoltativo) costo forzato di un livello, ad esempio  costs: {3: 100}
# ----------------------------------------------------------------------
upgrades:
  currency: coin               # cosa si spende: coin, blockcoin oppure blockshell

  # MINIERE: ogni miniera sblocca 10 livelli di potenziamento (21 miniere = 210 livelli).
  # "1: 10" = con la miniera 1 si puo' arrivare al livello 10. Oltre serve la miniera dopo
  # (il tasto diventa rosso). La miniera del giocatore si cambia con  /bm mine get 1 <player>
  mines:
    1: 10
    2: 20
    3: 30
    4: 40
    5: 50
    6: 60
    7: 70
    8: 80
    9: 90
    10: 100
    11: 110
    12: 120
    13: 130
    14: 140
    15: 150
    16: 160
    17: 170
    18: 180
    19: 190
    20: 200
    21: 210

  gui:
    sounds:
      open:
        sound: "block.chest.open"
        volume: 0.6
        pitch: 1.2
      page:
        sound: "ui.button.click"
        volume: 0.6
        pitch: 1.2
      success:
        sound: "entity.player.levelup"
        volume: 0.6
        pitch: 1.5
      error:
        sound: "entity.villager.no"
        volume: 0.8
        pitch: 1.0

  # Per ogni potenziamento:
  #   cost-base      costo del livello 1
  #   cost-growth    il costo cresce in modo esponenziale: cost-base x cost-growth ^ livello
  #                  (1.05 = +5% a ogni livello. Piu' e' alto, piu' sale in fretta)
  #   cost-increase  (solo se togli cost-growth) il costo sale di tanto a ogni livello
  damage:
    label: "danno"
    max-level: 210
    per-level: 10              # +10 danno a livello
    cost-base: 5
    cost-growth: 1.05
  cooldown:
    label: "ricarica"
    max-level: 210
    per-level: 0.0019          # -0.0019 secondi a livello (a 210 livelli si arriva al minimo)
    min: 0.1                   # la ricarica non scende mai sotto questo valore
    cost-base: 5
    cost-growth: 1.05
  speed:
    label: "velocita"
    max-level: 210
    per-level: 0.01            # +0.01 velocita a livello
    cost-base: 5
    cost-growth: 1.05
  capacity:                    # capienza delle BLOCKSHELL
    label: "capienza shell"
    max-level: 210
    per-level: 1               # +1 shell al massimo a livello
    cost-base: 10
    cost-growth: 1.055
  # capienza di ogni palla: capacity_<nome palla>
  capacity_standardball:
    label: "capacità standardball"
    short: "capacità"          # nome mostrato nella lore (senza il nome della palla)
    max-level: 210
    per-level: 5               # +5 palle al massimo a livello
    cost-base: 10
    cost-growth: 1.05
  capacity_doubleball:
    label: "capacità doubleball"
    short: "capacità"
    max-level: 210
    per-level: 4
    cost-base: 20
    cost-growth: 1.055
  capacity_ghostball:
    label: "capacità ghostball"
    short: "capacità"
    max-level: 210
    per-level: 3
    cost-base: 40
    cost-growth: 1.06
  capacity_explosionball:
    label: "capacità explosionball"
    short: "capacità"
    max-level: 210
    per-level: 2
    cost-base: 80
    cost-growth: 1.065

# ----------------------------------------------------------------------
#  GUI DEI POTENZIAMENTI (6 righe = 54 slot, si contano da 0: riga 1 = 0-8, riga 2 = 9-17 ...)
#  Il disegno della GUI e' nel resource pack. Qui si dice dove stanno le cose.
#  Pannelli: sono pannelli di vetro con un custom-model-data. Quelli invisibili (999)
#  servono solo a mostrare nome e lore quando ci passi sopra.
#  Segnaposto: %label% %description% %level% %max% %current% %next% %next_level%
#              %cost% %currency% %balance% %mine% %coin% %blockcoin% %shell% %ammo% %page% %pages%
# ----------------------------------------------------------------------
upgrade-gui:
  invisible:
    material: GLASS_PANE
    cmd: 999

  # ordine dei potenziamenti. Ogni pagina ne contiene tanti quante sono le "positions" qui sotto.
  # Se ne aggiungi altri compaiono pagine nuove da sole.
  order: [damage, cooldown, speed, capacity, capacity_standardball, capacity_doubleball, capacity_ghostball, capacity_explosionball]

  slots:
    close: [0, 1]              # X
    previous: [2]              # freccia sinistra
    next: [6]                  # freccia destra
    info: [7, 8]               # tasto info
    # una voce per potenziamento di ogni pagina:
    #   icon    il quadrato con l'icona      button  il tasto verde / rosso / grigio
    #   extra   altri slot sotto il tasto (facoltativo: cliccano come il tasto)
    positions:
      - {icon: 19, button: 21, extra: []}
      - {icon: 23, button: 25, extra: []}
      - {icon: 37, button: 39, extra: []}
      - {icon: 41, button: 43, extra: []}

  close:
    name: "&cchiudi"
    lore: []
  previous:
    name: "&7pagina precedente"
    lore:
      - "&8pagina &f%page%&8/&f%pages%"
  next:
    name: "&7pagina successiva"
    lore:
      - "&8pagina &f%page%&8/&f%pages%"
  info:
    name: "&6informazioni"
    lore:
      - ""
      - "&7qui potenzi il tuo lanciapalle"
      - "&7pagando con i tuoi coin"
      - ""
      - "&8• &7coin &a%coin%"
      - "&8• &7miniera &f%mine%"

  # i tre tasti: cmd 1 = verde (si puo' potenziare), 2 = rosso (serve la miniera dopo),
  # 3 = grigio (potenziamento che non esiste ancora). "maxed" = livello massimo raggiunto (rosso).
  buttons:
    available:
      material: GLASS_PANE
      cmd: 1
      name: "&alivello &f%level% &8→ &f%next_level%"
      lore:
        - ""
        - "&8• &7%label% &f%current% &8→ &a%next%"
        - "&8• &7costo &e%cost% &7%currency%"
        - ""
        - "&eclicca per potenziare"
    locked:
      material: GLASS_PANE
      cmd: 2
      name: "&clivello &f%level% &8→ &f%next_level%"
      lore:
        - ""
        - "&7per continuare devi sbloccare"
        - "&7la miniera successiva"
        - ""
        - "&8• &7miniera attuale &f%mine%"
    none:
      material: GLASS_PANE
      cmd: 3
      name: "&8in arrivo"
      lore:
        - ""
        - "&7qui arrivera un nuovo potenziamento"
    maxed:
      material: GLASS_PANE
      cmd: 2
      name: "&clivello massimo"
      lore:
        - ""
        - "&8• &7%label% &f%current%"
        - ""
        - "&7hai gia il massimo"

  # lore delle icone (se un'icona non ne ha una sua)
  icon-lore:
    - "&7%description%"
    - ""
    - "&8• &7livello &f%level%&8/&f%max%"
    - "&8• &7%label% attuale &f%current%"

  # le icone: il quadrato di ogni potenziamento. cmd = modello nel pack (le puoi cambiare quando le disegni)
  icons:
    damage:
      material: GLASS_PANE
      cmd: 401
      name: "&f%label%"
      description: "aumenta il danno delle tue palle"
    cooldown:
      material: GLASS_PANE
      cmd: 402
      name: "&f%label%"
      description: "riduce l'attesa tra uno sparo e l'altro"
    speed:
      material: GLASS_PANE
      cmd: 403
      name: "&f%label%"
      description: "le palle viaggiano piu veloci"
    capacity:
      material: GLASS_PANE
      cmd: 404
      name: "&f%label%"
      description: "puoi portare piu blockshell"
    capacity_standardball:
      material: GLASS_PANE
      cmd: 408
      name: "&f%label%"
      description: "puoi portare piu standardball"
    capacity_doubleball:
      material: GLASS_PANE
      cmd: 405
      name: "&f%label%"
      description: "puoi portare piu doubleball"
    capacity_ghostball:
      material: GLASS_PANE
      cmd: 406
      name: "&f%label%"
      description: "puoi portare piu ghostball"
    capacity_explosionball:
      material: GLASS_PANE
      cmd: 407
      name: "&f%label%"
      description: "puoi portare piu explosionball"

  # TITOLO. title.text e' il testo/sfondo disegnato (i caratteri del tuo font); {shift:N} sposta di N pixel
  # (negativo = indietro). I numeri delle pagine stanno in title.page e restano fermi
  # qualunque sia il titolo.
  title:
    text: "&8potenziamenti"
    font: ""                   # font di title.text (vuoto = normale)
    # larghezza (in pixel) dei caratteri disegnati usati in title.text: larghezza dell'immagine nel pack + 1.
    # Serve per mettere i numeri sempre nello stesso punto sopra lo sfondo. Le lettere normali le calcola da solo.
    widths:
      "\u3c03": 179
    advance: 0                 # 0 = calcolato da solo. Se metti un numero, vale sempre quello
    page:
      text: "%page%/%pages%"   # vuoto = niente numeri
      set: main                # quale set di numeri (vedi "glyphs")
      shadow: true             # true = numeri con l'ombra
      shadow-set: main-shadow
      font: ""
      center: 73               # centro dei numeri, in pixel dall'inizio del titolo (piu' alto = piu' a destra)

# ----------------------------------------------------------------------
#  STAMINA (barra gialla dentro la bossbar principale, sempre piena)
#  Si svuota solo con l'attacco potenziato. Serve il pack aggiornato (barra gialla in bossbar.json)
# ----------------------------------------------------------------------
stamina:
  enabled: true
  bar-width: 182               # larghezza in pixel (182 = come una bossbar normale), disegnata sotto la bossbar principale
  bar-fill: "\u3c14"           # pezzo pieno giallo (bossbar.json)
  bar-empty: "\u3c15"          # pezzo vuoto giallo

# ----------------------------------------------------------------------
#  ATTACCO POTENZIATO: dopo un numero a caso di colpi ai blocchi (da unlock-hits-min a unlock-hits-max) se ne sblocca uno.
#  Si usa con shift + click destro tenendo il lanciapalle in mano: spara UN colpo potenziato con la palla scelta e consuma TUTTA la stamina
#  (da 0 a piena in regen-seconds). I colpi (anche ai rimbalzi) hanno una scia di fuoco ed esplodono a ogni impatto. /bm limits off toglie questi limiti (per lo staff)
# ----------------------------------------------------------------------
power-attack:
  enabled: true
  unlock-hits-min: 500         # ogni blocco colpito da una palla (anche ai rimbalzi) conta 1.
  unlock-hits-max: 3000        # Per sbloccarne uno servono un numero a caso di colpi tra min e max
  max-charges: 1               # quanti se ne possono tenere
  uses-per-unlock: 1           # quanti attacchi regala ogni sblocco (per un giocatore: /bm power uses <n>)
  regen-seconds: 180           # tempo per ricaricare la stamina da 0 (180 = 3 minuti)
  cooldown-ticks: 12           # dopo il colpo potenziato non parte subito uno normale
  damage-multiplier: 10.0      # danno rispetto al normale
  trail-particles: 4           # fiamme della scia a ogni tick
  bossbar:
    color: PURPLE
    ready: "&dx%charges% attacco potenziato sbloccato &8| {key:shift + click destro}"
    waiting: "&dx%charges% attacco potenziato sbloccato &8| &7aspetta la stamina"
  sounds:
    unlock:
      sound: "ui.toast.challenge_complete"
      volume: 0.8
      pitch: 1.0
    use:
      sound: "entity.wither.shoot"
      volume: 1.5
      pitch: 1.4

# ----------------------------------------------------------------------
#  GUI DELLE MINIERE  (/mines)
#  Ogni miniera e' un quadrato 2x2: il pannello col modello sta nello slot "icon", gli altri 3
#  slot ("extra") mostrano lo stesso nome e la stessa lore.
#  Modelli (cmd): ogni miniera ne ha 11 di fila: il grigio (non sbloccata) e le fasi 1..10.
#  cmd-start 101: miniera 1 = 101 grigio, 102 = 1-1 ... 111 = 1-10; miniera 2 = 112 grigio, 113 = 2-1 ...
#  L'ultimo della miniera 21 (21-10) e' il 331. I quadrati senza miniera usano empty-cmd (332).
#  Segnaposto: %number% %blocks% (da scavare) %broken% (scavati ora) %left% %total% (scavati in tutto)
#              %runs% (volte rifatta) %max_runs% %price% %redo_price% %coin% %blockcoin% %mine% %page% %pages%
# ----------------------------------------------------------------------
mines:
  max-blocks: 400000           # blocchi massimi di una miniera ufficiale
  blocks-per-tick: 20000       # quanti blocchi legge a ogni tick quando salvi una miniera
  paste-per-tick: 6000         # massimo di blocchi scritti a ogni tick quando prepara/aggiorna una miniera personale
  max-ms-per-tick: 6           # ... e comunque non piu' di tanti millisecondi per tick (se il server rallenta scrive meno)
  unload-after-seconds: 300    # una miniera personale esce dal mondo quando il player non c'e' piu' da tanti secondi
  world: blockmania_mines      # mondo vuoto delle miniere personali (si crea da solo)
  spacing-x: 1024              # distanza tra un giocatore e l'altro (in blocchi): piu grande della miniera piu larga
  spacing-z: 1024              # distanza tra una miniera e l'altra dello stesso giocatore
  base-y: 64                   # altezza a cui parte la miniera personale
  area:
    world: blockmania_area     # mondo staff con tutte le miniere ufficiali insieme (/bm mines area)
    spacing: 256               # distanza tra una miniera e l'altra nell'area
  edit:
    bossbar: "&epremi {key:shift + f} &eper salvare tutte le modifiche della miniera &f%mine% &8| &epremi {key:shift + q} &eper annullare"

mines-gui:
  count: 21                    # quante miniere esistono
  max-runs: 10                 # dopo tante volte la miniera e' platino e non si rifa piu
  stages: 10                   # quanti modelli ha ogni miniera (uno per volta rifatta)
  cmd-start: 101               # modello grigio della miniera 1
  empty-cmd: 332               # modello dei quadrati senza miniera
  # sfondo della GUI per numero di collegamenti verdi (0 verdi, 1 verde ... 5 verdi). Il carattere di
  # title.text viene sostituito da solo con quello giusto. I collegamenti verdi di una pagina sono
  # le miniere sbloccate in quella pagina meno 1.
  backgrounds: ["\u3c05", "\u3c07", "\u3c08", "\u3c09", "\u3c10", "\u3c11"]
  blocks:
    default: 3000              # blocchi da scavare in ogni miniera (puoi mettere "5: 4500" per cambiarne una)
  prices: {}                   # prezzo in blockcoin per comprare la miniera (default = i suoi blocchi)
  redo-prices: {}              # prezzo per rifarla

  invisible:
    material: GLASS_PANE
    cmd: 999

  slots:
    close: [0, 1]
    previous: [2]
    next: [6]
    info: [7, 8]
    # i 6 quadrati di ogni pagina, nell'ordine del percorso
    positions:
      - {icon: 19, extra: [9, 10, 18]}
      - {icon: 46, extra: [36, 37, 45]}
      - {icon: 49, extra: [39, 40, 48]}
      - {icon: 22, extra: [12, 13, 21]}
      - {icon: 25, extra: [15, 16, 24]}
      - {icon: 52, extra: [42, 43, 51]}

  close:
    name: "&cchiudi"
    lore: []
  previous:
    name: "&7pagina precedente"
    lore:
      - "&8pagina &f%page%&8/&f%pages%"
  next:
    name: "&7pagina successiva"
    lore:
      - "&8pagina &f%page%&8/&f%pages%"
  info:
    name: "&6informazioni"
    lore:
      - ""
      - "&7le miniere si comprano con i blockcoin"
      - ""
      - "&8• &7blockcoin &e%blockcoin%"
      - "&8• &7miniera &f%mine%"

  states:
    owned:
      material: GLASS_PANE
      name: "&aminiera %number%"
      lore:
        - ""
        - "&8• &7blocchi da scavare &a%blocks%"
        - "&8• &7scavati ora &e%broken%&8/&e%blocks%"
        - "&8• &7scavati in tutto &b%total%"
        - "&8• &7rifatta &d%runs%&8/&d%max_runs%"
    locked:
      material: GLASS_PANE
      name: "&cminiera %number%"
      lore:
        - ""
        - "&8• &7prezzo &e%price% &7blockcoin"
        - "&8• &7blocchi da scavare &a%blocks%"
        - ""
        - "%action%"
    platinum:
      material: GLASS_PANE
      name: "&bminiera %number% &8(platino)"
      lore:
        - ""
        - "&8• &7blocchi da scavare &a%blocks%"
        - "&8• &7scavati in tutto &b%total%"
        - "&8• &7rifatta &d%runs%&8/&d%max_runs%"
        - ""
        - "&bminiera platinata, non si rifa piu"
    empty:
      material: GLASS_PANE
      name: "&8miniera non disponibile"
      lore:
        - ""
        - "&7presto arrivera una nuova miniera"

  # riga "%action%" della lore delle miniere bloccate: buy = e' la prossima e si puo comprare, far = ce ne sono altre prima
  actions:
    buy: "&eclicca per acquistare"
    far: "&7sblocca prima la miniera precedente"
    owned: "&eclicca per entrare"
    platinum: "&eclicca per entrare"

  sounds:
    buy:
      sound: "entity.player.levelup"
      volume: 0.8
      pitch: 1.2
    error:
      sound: "entity.villager.no"
      volume: 0.8
      pitch: 1.0
    open:
      sound: "block.chest.open"
      volume: 0.6
      pitch: 1.2
    page:
      sound: "ui.button.click"
      volume: 0.6
      pitch: 1.2

  title:
    text: "&f{shift:-15}\u3c05"
    font: ""
    widths:
      "\u3c05": 179
    advance: 0
    page:
      text: "%page%/%pages%"
      set: main
      shadow: true
      shadow-set: main-shadow
      font: ""
      center: 73

# ----------------------------------------------------------------------
#  GUI DEGLI OGGETTI  (/bm items)
#  In alto le categorie, al centro gli oggetti: clic = ne ricevi 1, shift + clic = uno stack.
#  Gli slot si contano da 0 (riga 1 = 0-8, riga 2 = 9-17 ...).
#  Segnaposto: %page% %pages% %category% %count% (nelle categorie anche %material% %cmd% negli oggetti)
# ----------------------------------------------------------------------
items-gui:
  invisible:
    material: GLASS_PANE
    cmd: 999

  slots:
    close: [0, 1]
    categories: [2, 3, 4, 5, 6, 7, 8]
    up: [17, 26]               # freccia su (pagina precedente)
    page: [35]                 # al centro: il numero di pagina
    down: [44, 53]             # freccia giu' (pagina successiva)
    grid: [9, 10, 11, 12, 13, 14, 15, 16, 18, 19, 20, 21, 22, 23, 24, 25, 27, 28, 29, 30, 31, 32, 33, 34, 36, 37, 38, 39, 40, 41, 42, 43, 45, 46, 47, 48, 49, 50, 51, 52]

  sounds:
    open:
      sound: "block.chest.open"
      volume: 0.6
      pitch: 1.2
    page:
      sound: "ui.button.click"
      volume: 0.6
      pitch: 1.2
    give:
      sound: "entity.item.pickup"
      volume: 0.5
      pitch: 1.4

  close:
    name: "&cchiudi"
    lore: []
  up:
    name: "&7pagina precedente"
    lore:
      - "&8pagina &f%page%&8/&f%pages%"
  page:
    name: "&7pagina &f%page%&8/&f%pages%"
    lore:
      - "&8%category%: &f%count% &8oggetti"
  down:
    name: "&7pagina successiva"
    lore:
      - "&8pagina &f%page%&8/&f%pages%"
  empty-category:
    name: "&8in arrivo"
    lore:
      - ""
      - "&7questa categoria non e' ancora pronta"
  selected-line: "&a► aperta"
  click-line: "&eclicca per aprire"

  # come si vede un oggetto nella lista (se non e' un lanciapalle o un blocco)
  item-name: "&f%material% &8cmd &f%cmd%"
  item-lore:
    - ""
    - "&6clic &7ne ricevi 1"
    - "&6shift + clic &7ricevi uno stack"

  # LE CATEGORIE (la barra in alto, una per slot di "categories").
  #   type: blocks = i note block custom (solo la variante 1 di ognuno)
  #         items  = un oggetto per ogni custom-model-data indicato (material + cmds)
  #         none   = posto ancora vuoto
  #   cmds: elenco o intervalli, ad esempio  "1-53"  oppure  "1,2,3,10,999"  oppure  [1, 2]
  categories:
    - id: noteblock
      type: blocks
      name: "&fnote block"
      lore:
        - ""
        - "&7tutti i blocchi custom"
    - id: stick
      type: items
      material: STICK
      cmds: "1-2"
      name: "&fstick"
      lore:
        - ""
        - "&7oggetti con il modello dello stick"
    - id: feather
      type: items
      material: FEATHER
      cmds: "1-53"
      name: "&fpiuma"
      lore:
        - ""
        - "&7oggetti con il modello della piuma"
    - id: glass_pane
      type: items
      material: GLASS_PANE
      cmds: "1,2,3,4,10,999"
      name: "&fpannello"
      lore:
        - ""
        - "&7pannelli di vetro con modelli e icone"
    - id: snowball
      type: items
      material: SNOWBALL
      cmds: "1-4"
      name: "&fpalla di neve"
      lore:
        - ""
        - "&7palle con il modello custom"
    - id: free1
      type: none
      name: "&8in arrivo"
      lore:
        - ""
        - "&7categoria non ancora impostata"
    - id: free2
      type: none
      name: "&8in arrivo"
      lore:
        - ""
        - "&7categoria non ancora impostata"

  # TITOLO: sfondo disegnato + numeri verticali (1 sopra, 2 sotto) nella casella a destra
  title:
    text: "&f{shift:-15}\u3c04"
    font: ""
    widths:
      "\u3c04": 179           # larghezza dell'immagine oggetti.png + 1
    advance: 0
    numbers:
      enabled: true
      center: 156             # centro dei numeri verso destra, in pixel dall'inizio del titolo
      shadow: true
      current-set: top        # numero della pagina attuale (in alto)
      current-shadow-set: top-shadow
      total-set: bottom       # numero delle pagine totali (in basso)
      total-shadow-set: bottom-shadow
      font: ""

# ----------------------------------------------------------------------
#  SFONDO AUTOMATICO dietro ad actionbar e bossbar
#  Il plugin misura il testo (con le misure vere del font di Minecraft) e costruisce
#  da solo lo sfondo con i pezzi del resource pack. I caratteri e le larghezze qui sotto
#  devono combaciare con il tuo assets/minecraft/font/default.json e con i PNG.
#  Prova con:  /bm bgtest <testo>
# ----------------------------------------------------------------------
background:
  enabled: true
  actionbar: true              # sfondo su tutti i messaggi della actionbar
  bossbar: true                # sfondo sul testo delle bossbar
  remove-shadow: true          # true = lo sfondo non ha l'ombra (il testo la mantiene)
  padding: 0                   # pixel di margine in piu' dentro lo sfondo (ai due lati)
  gap: 3                       # pixel di distanza tra un riquadro e l'altro
  adjust: 0                    # per correggere la larghezza: +1 allarga, -1 stringe (di 1 pixel)
  unknown-char-width: 6        # larghezza usata per le lettere che il font normale non ha
  left:
    char: "\u3c00"             # bordo sinistro
    width: 6                   # larghezza del PNG in pixel
  center:
    char: "\u3c01"             # pezzo centrale (si ripete)
    width: 1
  right:
    char: "\u3c02"             # bordo destro
    width: 6
  # Tasti: nei testi (actionbar e bossbar) scrivi {key:shift + f} e il comando esce in un riquadro a parte, come un tasto.
  # Ha lo stesso sfondo del resto, ma e' staccato dalla frase. Nella chat si legge solo il testo.
  key:
    own-art: false             # true = usa un sfondo grafico diverso (servono 3 PNG in piu' nel pack): lascia false
    color: "&f"                # colore del testo dentro il tasto
    left:
      char: "\u3c20"
      width: 6
    center:
      char: "\u3c21"
      width: 1
    right:
      char: "\u3c22"
      width: 6
  # Icone nel testo: scrivi {icon:nome} (anche in /bm bgtest) e il plugin le misura, le tiene bianche e senza ombra.
  #   char   il carattere nel tuo font (default.json), non uno gia usato (3c00-3c06, 3c10-3c15, 3c20-3c22)
  #   width  larghezza nel gioco = (colonna piu a destra con pixel nel PNG) * height / altezza PNG, arrotondato, + 1
  icons:
    standardball:
      char: "\u3c40"
      width: 13
    doubleball:
      char: "\u3c41"
      width: 13
    ghostball:
      char: "\u3c42"
      width: 13
    explosionball:
      char: "\u3c43"
      width: 13
    coin:
      char: "\u3c44"
      width: 13
    blockcoin:
      char: "\u3c45"
      width: 13
    blockshell:
      char: "\u3c46"
      width: 12
    danno:
      char: "\u3c47"
      width: 12
    cooldown:
      char: "\u3c48"
      width: 12
    velocita:
      char: "\u3c49"
      width: 12
    capacita:
      char: "\u3c50"
      width: 12
    capacita_standardball:
      char: "\u3c51"
      width: 12
    capacita_doubleball:
      char: "\u3c52"
      width: 13
    capacita_ghostball:
      char: "\u3c53"
      width: 12
    capacita_explosionball:
      char: "\u3c54"
      width: 12
    colpo_potenziato:
      char: "\u3c55"
      width: 13
    miniera:
      char: "\u3c56"
      width: 13
    stamina:
      char: "\u3c57"
      width: 13
    bloccato:
      char: "\u3c58"
      width: 13
    livello:
      char: "\u3c59"
      width: 13
  bar:                         # barra di avanzamento sotto lo sfondo (usata dalla vendita shell)
    enabled: true
    fill: "\u3c10"              # pezzo pieno (1 pixel)
    empty: "\u3c11"             # pezzo vuoto (1 pixel)
    left: "\u3c12"              # bordo sinistro fisso della barra (vuoto = nessun bordo)
    right: "\u3c13"             # bordo destro fisso
    cap-width: 1                 # larghezza in pixel dei due bordi (come le PNG)
  # spazi invisibili del font: quantita' in pixel -> carattere
  negative-spaces:
    1: "\u2f1e"
    2: "\u3400"
    3: "\u3401"
    4: "\u3402"
    5: "\u3403"
    6: "\u3404"
    16: "\u4977"
    32: "\u4978"
  positive-spaces:
    1: "\u3410"
    2: "\u3411"
    4: "\u3412"
    8: "\u3413"
    16: "\u3414"
    32: "\u3415"

# ----------------------------------------------------------------------
#  BLOCCHI CUSTOM (note block)
#  Segnaposto per item-name e lore: %number% %variant% %health%
# ----------------------------------------------------------------------
blocks:
  max: 114                     # fino a che numero si ottiene con /bm getblock N-1
                               # (con i soli note block il massimo possibile e' 114)
  auto-detect: true            # true = ogni note block con lo stato di un blocco custom viene riconosciuto
                               # da solo (cosi' funzionano anche quelli piazzati con WorldEdit)
  custom-model-data: true      # true = l'oggetto ha il suo modello nel pack (si vede la grafica nell'inventario)
  item-name: "&e&lBlocco %number%"
  lore:
    - ""
    - "&7blocco resistente, si distrugge"
    - "&7a colpi di palla di neve"
    - ""
    - "&8• &7vita &a%health%"
    - "&8• &7codice &f%variant%"
  drop-on-destroy: false       # true = quando la vita arriva a 0 il blocco lascia l'oggetto
  health:
    base: 1000                 # vita del blocco 1
    increase-percent: 50       # ogni blocco ha il 50% di vita in piu' (1000, 1500, 2000...)
    mode: linear               # linear = +50% della base (1000, 1500, 2000)
                               # compound = +50% del precedente (1000, 1500, 2250)
    overrides: {}              # per forzare la vita di un blocco, ad esempio  3: 5000

# ----------------------------------------------------------------------
#  EFFETTI quando una palla colpisce un blocco
#  sound: nome del suono di Minecraft (vuoto = nessun suono)
# ----------------------------------------------------------------------
effects:
  shake:                       # vibrazione del blocco quando viene colpito o distrutto
    enabled: true
    on-hit: true               # vibra quando lo colpisci
    on-break: true             # vibra e si rimpicciolisce quando viene distrutto
    hit-ticks: 8               # durata della vibrazione al colpo (20 tick = 1 secondo)
    break-ticks: 10            # durata quando viene distrutto
    strength: 0.06             # quanto si sposta (in blocchi). 0.03 = poco, 0.1 = tanto
    break-shrink: true         # true = si rimpicciolisce mentre vibra, quando viene distrutto
  hit:
    particles: 8
    sound: "block.stone.hit"
    volume: 1.0
    pitch: 1.0
  destroy:
    particles: 40
    sound: "block.stone.break"
    volume: 1.0
    pitch: 1.0
  explosion:                   # explosionball: il primo urto di ogni palla esplode (scenico)
    radius: 1                  # raggio dell'esplosione in blocchi (1 = i 26 blocchi vicini)
    damage-percent: 25         # danno ai blocchi vicini, in % del danno della palla (0 = nessun danno)
    shake-multiplier: 3.0      # quanto vibra di piu del normale il blocco colpito
    particles: 1
  # i suoni usano volume alto di proposito: con volume 1 si sentono solo entro 16 blocchi, e le palle colpiscono da lontano
  explosion-sounds:            # esplosione (explosionball e colpo potenziato): ogni voce = un suono, si sentono insieme
    boom:
      sound: "entity.generic.explode"
      volume: 2.5
      pitch: 1.0
    crackle:
      sound: "entity.firework_rocket.blast"
      volume: 2.0
      pitch: 0.8
  ghost-sounds:                # ghostball: ogni blocco attraversato (i blocchi sfarfallano con il contorno azzurro)
    whisper:
      sound: "particle.soul_escape"
      volume: 2.0
      pitch: 0.9
    wail:
      sound: "entity.vex.ambient"
      volume: 1.0
      pitch: 1.6
