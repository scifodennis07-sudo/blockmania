# ======================================================================
#  BlockMania - configurazione
#  Dopo aver cambiato qualcosa usa  /blockmania reload
#
#  - Scrivi i testi normalmente: il plugin li trasforma da solo in tiny text
#    (i numeri, i simboli e i codici colore restano uguali).
#  - Colori: &a &c &7 ... e anche esadecimali  &#ff8800
#  - Gli oggetti che hai gia' in inventario vanno richiesti di nuovo
#    se cambi nome, lore o custom-model-data.
# ======================================================================

config-version: 2   # non toccare: serve al plugin per aggiornare il config

# true = tutte le scritte in tiny text. false = scritte normali.
tiny-text: true

# Cosa compare quando si preme TAB al posto di un numero
tab:
  number: "<numero>"

# ----------------------------------------------------------------------
#  STILI DEI MESSAGGI
#  Ogni messaggio ha un "type" che sceglie lo stile qui sotto.
#    color     colore del testo
#    highlight colore dei valori (nomi, numeri) dentro al messaggio
#    prefix    testo messo PRIMA del messaggio (vuoto = niente)
#    suffix    testo messo DOPO il messaggio
# ----------------------------------------------------------------------
styles:
  error:
    color: "&c"
    highlight: "&f"
    prefix: ""
    suffix: ""
  success:
    color: "&a"
    highlight: "&f"
    prefix: ""
    suffix: ""
  info:
    color: "&7"
    highlight: "&f"
    prefix: ""
    suffix: ""
  warning:
    color: "&e"
    highlight: "&f"
    prefix: ""
    suffix: ""

# ----------------------------------------------------------------------
#  MESSAGGI
#    type     error / success / info / warning (oppure uno stile tuo qui sopra)
#    channel  chat = in chat, actionbar = sopra l'hotbar
#    text     il testo (una riga, oppure una lista di righe)
#  Segnaposto: %value% = quello che il giocatore ha scritto, %usage% = come si usa
#  il comando, e altri indicati caso per caso.
# ----------------------------------------------------------------------
messages:
  no-permission:
    type: error
    channel: actionbar
    text: "non hai il permesso per usare questo comando"
  unknown-subcommand:
    type: error
    channel: actionbar
    text: "comando sconosciuto: %value%, scrivi /bm help per vedere la lista"
  missing-item:
    type: error
    channel: actionbar
    text: "manca il nome dell'oggetto, uso: %usage%, disponibili: %items%"
  unknown-item:
    type: error
    channel: actionbar
    text: "oggetto sconosciuto: %value%, disponibili: %items%"
  missing-block:
    type: error
    channel: actionbar
    text: "manca il codice del blocco, uso: %usage% (da 1-1 a %max%-1)"
  invalid-block:
    type: error
    channel: actionbar
    text: "codice blocco non valido: %value%, scrivilo come numero-1, da 1-1 a %max%-1"
  missing-action:
    type: error
    channel: actionbar
    text: "manca l'azione, scegli tra: %actions%, uso: %usage%"
  invalid-action:
    type: error
    channel: actionbar
    text: "azione non valida: %value%, scegli tra: %actions%"
  missing-type:
    type: error
    channel: actionbar
    text: "manca il tipo di palla (%types% oppure all), uso: %usage%"
  unknown-ammo:
    type: error
    channel: actionbar
    text: "tipo di palla sconosciuto: %value%, scegli tra: %types% oppure all"
  missing-number:
    type: error
    channel: actionbar
    text: "manca il numero, uso: %usage%"
  invalid-number:
    type: error
    channel: actionbar
    text: "numero non valido: %value%, deve essere un intero maggiore di 0"
  player-not-found:
    type: error
    channel: actionbar
    text: "giocatore non trovato o offline: %value%"
  missing-player:
    type: error
    channel: actionbar
    text: "da console devi indicare il giocatore, uso: %usage%"
  given:
    type: success
    channel: actionbar
    text: "hai ricevuto %item%"
  given-other:
    type: success
    channel: actionbar
    text: "hai dato %item% a %player%"
  stat-updated:
    type: success
    channel: actionbar
    text: "%player% ora ha %value% %stat%"
  see:
    type: info
    channel: chat
    text: "%player% ha %value% %stat%"
  reloaded:
    type: success
    channel: actionbar
    text: "config ricaricato, oggetti caricati: %count%"
  no-ammo:
    type: error
    channel: actionbar
    text: "hai finito le palle"
  shell-full:
    type: error
    channel: actionbar
    text: "hai troppe blockshell, non puoi distruggere altri blocchi"
  cannot-break:
    type: error
    channel: actionbar
    text: "non puoi rompere questo blocco"
  ammo-full:
    type: error
    channel: actionbar
    text: "hai gia le palle al massimo (%ammo%)"
  ammo-bought:
    type: success
    channel: actionbar
    text: "hai comprato %amount% palle per %price% %currency%"
  shop-no-funds:
    type: error
    channel: actionbar
    text: "non hai abbastanza %currency%: ti servono %price%, ne hai %balance%"
  sell-no-shells:
    type: error
    channel: actionbar
    text: "non hai nessuna blockshell da vendere"
  sell-busy:
    type: error
    channel: actionbar
    text: "stai gia vendendo le tue blockshell"
  sell-done:
    type: success
    channel: actionbar
    text: "hai ottenuto %coins% coin"
  sell-cancelled:
    type: error
    channel: actionbar
    text: "vendita interrotta, hai ottenuto %coins% coin"
  shop-removed:
    type: success
    channel: actionbar
    text: "negozio %shop% tolto, la piuma e' tornata nel tuo inventario"
  shop-remove-hint:
    type: warning
    channel: actionbar
    text: "per togliere il negozio: shift + tasto destro a mano vuota"
  shop-spawned:
    type: success
    channel: actionbar
    text: "hai ricevuto la piuma del negozio %shop%, piazzala dove vuoi"
  missing-shop:
    type: error
    channel: actionbar
    text: "manca il tipo di negozio (ammo oppure sell), uso: %usage%"
  invalid-shop:
    type: error
    channel: actionbar
    text: "negozio non valido: %value%, scegli tra: ammo, sell"
  player-only:
    type: error
    channel: actionbar
    text: "questo comando si usa solo in gioco"
  upgrade-bought:
    type: success
    channel: actionbar
    text: "potenziamento %upgrade% al livello %level% per %cost% %currency%"
  upgrade-locked:
    type: error
    channel: actionbar
    text: "per potenziare %upgrade% oltre il livello %level% devi sbloccare la miniera successiva"
  upgrade-max:
    type: warning
    channel: actionbar
    text: "il potenziamento %upgrade% e' gia al livello massimo"
  upgrade-no-funds:
    type: error
    channel: actionbar
    text: "non hai abbastanza %currency%: ti servono %cost%, ne hai %balance%"

# ----------------------------------------------------------------------
#  /blockmania help  (sempre in chat)
#  Ogni comando ha: usage (come si scrive), description, example e permission
#  (chi non ha il permesso non vede quel comando). usage viene usato anche
#  nei messaggi di errore.
# ----------------------------------------------------------------------
help:
  header: "&6&lblockmania &8- &7guida ai comandi"
  usage-line: "&e%usage%"
  description-line: "&8  » &7%description%"
  example-line: "&8  » &7esempio: &f%example%"
  footer: "&8<> = obbligatorio, [] = facoltativo, se non scrivi il player vale per te"
  commands:
    get:
      permission: blockmania.get
      usage: "/bm get <oggetto> [player]"
      description: "ti da un oggetto, come il lanciapalle. se scrivi un player lo da a lui"
      example: "/bm get lanciapalle"
    getblock:
      permission: blockmania.get
      usage: "/bm getblock <numero>-1 [player]"
      description: "ti da un blocco da piazzare. il numero e' il tipo di blocco, il -1 e' sempre uguale"
      example: "/bm getblock 3-1"
    ball:
      permission: blockmania.stats
      usage: "/bm ball <get|remove|see|reset> <tipo|all> [numero] [player]"
      description: "gestisce le palle: get ne aggiunge, remove ne toglie, see le mostra, reset le azzera. all vale per tutti i tipi"
      example: "/bm ball get standardball 20"
    blockshell:
      permission: blockmania.stats
      usage: "/bm blockshell <get|remove|see|reset> [numero] [player]"
      description: "gestisce le blockshell (hanno un massimo). get ne aggiunge, remove ne toglie, see le mostra, reset le azzera"
      example: "/bm blockshell remove 3"
    blockcoin:
      permission: blockmania.stats
      usage: "/bm blockcoin <get|remove|see|reset> [numero] [player]"
      description: "gestisce i blockcoin (nessun limite). get ne aggiunge, remove ne toglie, see li mostra, reset li azzera"
      example: "/bm blockcoin see doppiax"
    mine:
      permission: blockmania.stats
      usage: "/bm mine <get|remove|see|reset> [numero] [player]"
      description: "gestisce la miniera del giocatore (parte da 1). Decide fino a che livello puo potenziare"
      example: "/bm mine get 1"
    coin:
      permission: blockmania.stats
      usage: "/bm coin <get|remove|see|reset> [numero] [player]"
      description: "gestisce i coin (nessun limite), la valuta dei potenziamenti. get ne aggiunge, remove ne toglie, see li mostra, reset li azzera"
      example: "/bm coin get 100"
    shop:
      permission: blockmania.shop.edit
      usage: "/bm shop <ammo|sell> [player]"
      description: "ti da la piuma per piazzare un negozio: ammo per comprare le palle, sell per vendere le blockshell"
      example: "/bm shop ammo"
    bgtest:
      permission: blockmania.reload
      usage: "/bm bgtest [testo]"
      description: "mostra un testo nella actionbar con lo sfondo, per controllare che sia centrato"
      example: "/bm bgtest coin 25"
    reload:
      permission: blockmania.reload
      usage: "/bm reload"
      description: "ricarica il config senza riavviare il server"
      example: ""
    help:
      permission: ""
      usage: "/bm help"
      description: "mostra questa guida"
      example: ""

# ----------------------------------------------------------------------
#  OGGETTI
#  Ogni voce e' un oggetto che si ottiene con  /blockmania get <nome-voce>
#  (scrivi il nome della voce in minuscolo)
#  Segnaposto per name e lore: %damage% %speed% %cooldown% %ammo%
#  (i valori mostrano gia' i potenziamenti del giocatore)
# ----------------------------------------------------------------------
items:
  lanciapalle:
    material: STICK            # tipo di oggetto (STICK, BLAZE_ROD, FEATHER, ...)
    custom-model-data: 1       # modello normale nel resource pack
    aim-custom-model-data: 2   # modello mentre tieni premuto shift (sembra che miri)
    projectile-custom-model-data: 1   # modello della palla lanciata (togli la riga = palla normale)
    projectile-material: SNOWBALL     # item usato per il modello della palla lanciata
    name: "&b&lLanciapalle"
    lore:
      - ""
      - "&7spara palle di neve contro i blocchi"
      - "&7per indebolirli e distruggerli"
      - ""
      - "&8• &7danno &c%damage%"
      - "&8• &7velocita &b%speed%"
      - "&8• &7ricarica &e%cooldown%s"
      - "&8• &7munizioni &f%ammo%"
      - ""
      - "&6tasto destro &7spara"
      - "&6q &7cambia munizione"
      - "&6sinistro &7apre i potenziamenti"
    speed: 1.5                 # velocita' base della palla (quella normale e' 1.5)
    cooldown: 0.5              # secondi base tra uno sparo e l'altro
    ammo: standardball         # che tipo di palle consuma (vedi "ammo")
    sound: "entity.snowball.throw"   # suono dello sparo (vuoto = nessun suono)
    volume: 0.5
    pitch: 0.4

# ----------------------------------------------------------------------
#  PALLE (virtuali: sono un numero per giocatore, non oggetti)
#    /blockmania ball get standardball 20
# ----------------------------------------------------------------------
ammo:
  standardball:
    damage: 50                 # vita base che toglie a un blocco quando lo colpisce
    max: 20                    # massimo di palle che si possono avere (0/20). Il potenziamento
                               # "capacity" lo aumenta. Metti un numero molto alto per togliere il limite

# ----------------------------------------------------------------------
#  BLOCKSHELL: +1 per ogni blocco distrutto. Al massimo non si possono
#  distruggere altri blocchi: si possono solo indebolire (l'ultimo colpo non fa danno).
#  BLOCKCOIN: +1 per ogni blocco distrutto, senza limite.
#  COIN: si guadagnano vendendo le blockshell al negozio (o con il comando).
# ----------------------------------------------------------------------
blockshell:
  max: 10

rewards:
  blockshell: 1
  blockcoin: 1

# ----------------------------------------------------------------------
#  VALORE DELLE SHELL IN COIN (in base al livello del blocco rotto: 1-1 = lv1, 2-1 = lv2 ...)
#    first      quanto vale una shell di lv1
#    step       dal lv2 in poi vale (livello-1) * step  ->  lv2=5, lv3=10, lv4=15...
#    overrides  per forzare un livello, ad esempio  7: 100
#    command-level  livello delle shell create con /bm blockshell get
# ----------------------------------------------------------------------
shells:
  command-level: 1
  values:
    first: 1
    step: 5
    overrides: {}

# ----------------------------------------------------------------------
#  NEGOZI (armor stand invisibili con una piuma in testa)
#  /bm shop ammo  e  /bm shop sell ti danno una piuma: piazzala per creare il negozio.
#  Per toglierlo: shift + tasto destro a mano vuota (e' permesso solo a chi ha blockmania.shop.edit).
#  Segnaposto ologramma: %price% %currency% %balance% %ammo% %ammo_max% %shells% %coins%
# ----------------------------------------------------------------------
shops:
  ammo:
    material: FEATHER
    custom-model-data: 1
    item:                      # la piuma che si ottiene con /bm shop ammo
      name: "&e&lnegozio palle"
      lore:
        - ""
        - "&7piazzala per creare il negozio delle palle"
        - "&8shift + destro a mano vuota per toglierlo"
    ammo-type: standardball    # che palle riempie
    currency: coin             # cosa si paga: coin, blockcoin oppure blockshell
    price: 10                  # prezzo del rifornimento completo
    hologram:
      - "&e&lnegozio palle"
      - "&7clicca per acquistare per &e%price% %currency%"
      - "&8palle &f%ammo%&8/&f%ammo_max%"
    sounds:
      buy:
        sound: "entity.experience_orb.pickup"
        volume: 0.8
        pitch: 1.2
      error:
        sound: "entity.villager.no"
        volume: 0.8
        pitch: 1.0
  sell:
    material: FEATHER
    custom-model-data: 6
    item:                      # la piuma che si ottiene con /bm shop sell
      name: "&6&lvendita blockshell"
      lore:
        - ""
        - "&7piazzala per creare il negozio di vendita"
        - "&8shift + destro a mano vuota per toglierlo"
    seconds-per-shell: 0.2     # tempo per vendere ogni shell
    max-distance: 6            # se ti allontani di piu la vendita si ferma
    hologram:
      - "&6&lvendita blockshell"
      - "&7tasto destro per vendere le tue blockshell"
      - "&8hai &f%shells% &8shell, valgono &e%coins% coin"
    bossbar:
      # Ogni livello di shell ha il suo riquadro. Segnaposto di group-format:
      #   %count% quante shell di quel livello  %level% il livello
      #   %coins% quanto vale UNA shell di quel livello  %group_total% valore di tutte quelle del livello
      group-format: "&fx%count% &7lv%level% &e%coins% coin"
      title: ""                # riquadro iniziale facoltativo, ad esempio "&7vendita" (vuoto = nessuno)
      color: GREEN
      style: PROGRESS
      progress-bar: true       # true = disegna la barra sotto lo sfondo (serve bossbar.json aggiornato)
    sounds:
      tick:
        sound: "block.note_block.hat"
        volume: 0.5
        pitch: 1.6
      done:
        sound: "entity.player.levelup"
        volume: 0.8
        pitch: 1.5

# Ologramma sopra lo stand (compare solo a chi lo guarda)
hologram:
  range: 5                     # da quanti blocchi si vede
  height: 2.4                  # altezza sopra lo stand
  update-ticks: 5              # ogni quanti tick si aggiorna (20 tick = 1 secondo)

# ----------------------------------------------------------------------
#  BOSSBAR (la barra in alto, sempre piena)
#  Segnaposto: %ammo% %ammo_max% %shell% %shell_max% %blockcoin% %coin%
# ----------------------------------------------------------------------
bossbar:
  enabled: true
  always-visible: true         # false = visibile solo con il lanciapalle in mano
  ammo-type: standardball      # di quale tipo di palla mostra il numero
  # un riquadro (sfondo) per ogni voce della lista. Aggiungi, togli o cambia le righe come vuoi
  segments:
    - "&bstandardball: &f%ammo%&8/&f%ammo_max%"
    - "&6blockshell: &f%shell%/%shell_max%"
    - "&eblockcoin: &f%blockcoin%"
    - "&acoin: &f%coin%"
  text: "&bstandardball: &f%ammo%&8/&f%ammo_max% &8| &6blockshell: &f%shell%/%shell_max% &8| &eblockcoin: &f%blockcoin% &8| &acoin: &f%coin%"   # usato solo se segments e' vuoto
  font: ""                     # font del pack per abbassare il testo, ad esempio "minecraft:bossbar"
                               # (vuoto = font normale). Attivalo solo dopo aver messo bossbar.json nel pack
  color: BLUE                  # PINK BLUE RED GREEN YELLOW PURPLE WHITE
  style: PROGRESS              # PROGRESS NOTCHED_6 NOTCHED_10 NOTCHED_12 NOTCHED_20

# ----------------------------------------------------------------------
#  POTENZIAMENTI (tasto sinistro con il lanciapalle, senza shift)
#  I livelli sono del giocatore e valgono per tutti i suoi lanciapalle.
#  Per ogni potenziamento:
#    label          nome mostrato          max-level      livello massimo in assoluto
#    per-level      quanto cambia a livello
#    cost-base      costo del livello 1    cost-increase  quanto sale il costo a ogni livello
#    costs          (facoltativo) costo forzato di un livello, ad esempio  costs: {3: 100}
# ----------------------------------------------------------------------
upgrades:
  currency: coin               # cosa si spende: coin, blockcoin oppure blockshell

  # MINIERE: fino a che livello di potenziamento si puo' arrivare con ogni miniera.
  # "1: 3" = con la miniera 1 si puo' arrivare al livello 3. Oltre serve la miniera dopo
  # (il tasto diventa rosso). La miniera del giocatore si cambia con  /bm mine get 1 <player>
  mines:
    1: 3
    2: 6
    3: 10

  gui:
    sounds:
      open:
        sound: "block.chest.open"
        volume: 0.6
        pitch: 1.2
      page:
        sound: "ui.button.click"
        volume: 0.6
        pitch: 1.2
      success:
        sound: "entity.player.levelup"
        volume: 0.6
        pitch: 1.5
      error:
        sound: "entity.villager.no"
        volume: 0.8
        pitch: 1.0

  damage:
    label: "danno"
    max-level: 10
    per-level: 10              # +10 danno a livello
    cost-base: 5
    cost-increase: 5
  cooldown:
    label: "ricarica"
    max-level: 8
    per-level: 0.05            # -0.05 secondi a livello
    min: 0.1                   # la ricarica non scende mai sotto questo valore
    cost-base: 5
    cost-increase: 5
  speed:
    label: "velocita"
    max-level: 10
    per-level: 0.1             # +0.1 velocita a livello
    cost-base: 5
    cost-increase: 5
  capacity:
    label: "capienza"
    max-level: 5
    per-level: 10              # +10 palle al massimo a livello
    cost-base: 10
    cost-increase: 10

# ----------------------------------------------------------------------
#  GUI DEI POTENZIAMENTI (6 righe = 54 slot, si contano da 0: riga 1 = 0-8, riga 2 = 9-17 ...)
#  Il disegno della GUI e' nel resource pack. Qui si dice dove stanno le cose.
#  Pannelli: sono pannelli di vetro con un custom-model-data. Quelli invisibili (999)
#  servono solo a mostrare nome e lore quando ci passi sopra.
#  Segnaposto: %label% %description% %level% %max% %current% %next% %next_level%
#              %cost% %currency% %balance% %mine% %coin% %blockcoin% %shell% %ammo% %page% %pages%
# ----------------------------------------------------------------------
upgrade-gui:
  invisible:
    material: GLASS_PANE
    cmd: 999

  # ordine dei potenziamenti. Ogni pagina ne contiene tanti quante sono le "positions" qui sotto.
  # Se ne aggiungi altri compaiono pagine nuove da sole.
  order: [damage, cooldown, speed, capacity]

  slots:
    close: [0, 1]              # X
    previous: [2]              # freccia sinistra
    next: [6]                  # freccia destra
    info: [7, 8]               # tasto info
    # una voce per potenziamento di ogni pagina:
    #   icon    il quadrato con l'icona      button  il tasto verde / rosso / grigio
    #   extra   altri slot sotto il tasto (facoltativo: cliccano come il tasto)
    positions:
      - {icon: 19, button: 21, extra: []}
      - {icon: 23, button: 25, extra: []}
      - {icon: 37, button: 39, extra: []}
      - {icon: 41, button: 43, extra: []}

  close:
    name: "&cchiudi"
    lore: []
  previous:
    name: "&7pagina precedente"
    lore:
      - "&8pagina &f%page%&8/&f%pages%"
  next:
    name: "&7pagina successiva"
    lore:
      - "&8pagina &f%page%&8/&f%pages%"
  info:
    name: "&6informazioni"
    lore:
      - ""
      - "&7qui potenzi il tuo lanciapalle"
      - "&7pagando con i tuoi coin"
      - ""
      - "&8• &7coin &a%coin%"
      - "&8• &7miniera &f%mine%"

  # i tre tasti: cmd 1 = verde (si puo' potenziare), 2 = rosso (serve la miniera dopo),
  # 3 = grigio (potenziamento che non esiste ancora). "max" e' il livello massimo raggiunto.
  buttons:
    available:
      material: GLASS_PANE
      cmd: 1
      name: "&alivello &f%level% &8→ &f%next_level%"
      lore:
        - ""
        - "&8• &7%label% &f%current% &8→ &a%next%"
        - "&8• &7costo &e%cost% &7%currency%"
        - ""
        - "&eclicca per potenziare"
    locked:
      material: GLASS_PANE
      cmd: 2
      name: "&clivello &f%level% &8→ &f%next_level%"
      lore:
        - ""
        - "&7per continuare devi sbloccare"
        - "&7la miniera successiva"
        - ""
        - "&8• &7miniera attuale &f%mine%"
    none:
      material: GLASS_PANE
      cmd: 3
      name: "&8in arrivo"
      lore:
        - ""
        - "&7qui arrivera un nuovo potenziamento"
    max:
      material: GLASS_PANE
      cmd: 1
      name: "&alivello massimo"
      lore:
        - ""
        - "&8• &7%label% &f%current%"
        - ""
        - "&7hai gia il massimo"

  # lore delle icone (se un'icona non ne ha una sua)
  icon-lore:
    - "&7%description%"
    - ""
    - "&8• &7livello &f%level%&8/&f%max%"
    - "&8• &7%label% attuale &f%current%"

  # le icone: il quadrato di ogni potenziamento. cmd = modello nel pack (le puoi cambiare quando le disegni)
  icons:
    damage:
      material: GLASS_PANE
      cmd: 101
      name: "&f%label%"
      description: "aumenta il danno delle tue palle"
    cooldown:
      material: GLASS_PANE
      cmd: 102
      name: "&f%label%"
      description: "riduce l'attesa tra uno sparo e l'altro"
    speed:
      material: GLASS_PANE
      cmd: 103
      name: "&f%label%"
      description: "le palle viaggiano piu veloci"
    capacity:
      material: GLASS_PANE
      cmd: 104
      name: "&f%label%"
      description: "puoi portare piu palle"

  # TITOLO. title.text e' il testo/sfondo disegnato (i caratteri del tuo font); {shift:N} sposta di N pixel
  # (negativo = indietro). I numeri delle pagine si mettono in title.page, con un font abbassato.
  title:
    text: "&8potenziamenti"
    font: ""                   # font di title.text (vuoto = normale)
    text-advance: 0            # di quanti pixel va avanti il cursore alla fine di title.text (se torna all'inizio: 0)
    slash: "/"
    page:
      text: "&8%page%%slash%%pages%"   # vuoto = niente numeri
      font: "minecraft:gui"            # font abbassato (gui.json nel pack)
      center: 80                       # centro dei numeri, in pixel dall'inizio del titolo (80 = centro della GUI)
    # se disegni dei numeri tuoi, metti qui i caratteri: digits: {"0": "\uE400", "1": "\uE401"}
    digits: {}

# ----------------------------------------------------------------------
#  SFONDO AUTOMATICO dietro ad actionbar e bossbar
#  Il plugin misura il testo (con le misure vere del font di Minecraft) e costruisce
#  da solo lo sfondo con i pezzi del resource pack. I caratteri e le larghezze qui sotto
#  devono combaciare con il tuo assets/minecraft/font/default.json e con i PNG.
#  Prova con:  /bm bgtest <testo>
# ----------------------------------------------------------------------
background:
  enabled: true
  actionbar: true              # sfondo su tutti i messaggi della actionbar
  bossbar: true                # sfondo sul testo delle bossbar
  remove-shadow: true          # true = lo sfondo non ha l'ombra (il testo la mantiene)
  padding: 0                   # pixel di margine in piu' dentro lo sfondo (ai due lati)
  gap: 3                       # pixel di distanza tra un riquadro e l'altro
  adjust: 0                    # per correggere la larghezza: +1 allarga, -1 stringe (di 1 pixel)
  unknown-char-width: 6        # larghezza usata per le lettere che il font normale non ha
  left:
    char: "\u3c00"             # bordo sinistro
    width: 6                   # larghezza del PNG in pixel
  center:
    char: "\u3c01"             # pezzo centrale (si ripete)
    width: 1
  right:
    char: "\u3c02"             # bordo destro
    width: 6
  bar:                         # barra di avanzamento sotto lo sfondo (usata dalla vendita shell)
    enabled: true
    fill: "\u3c10"              # pezzo pieno (1 pixel)
    empty: "\u3c11"             # pezzo vuoto (1 pixel)
    left: "\u3c12"              # bordo sinistro fisso della barra (vuoto = nessun bordo)
    right: "\u3c13"             # bordo destro fisso
    cap-width: 1                 # larghezza in pixel dei due bordi (come le PNG)
  # spazi invisibili del font: quantita' in pixel -> carattere
  negative-spaces:
    1: "\u2f1e"
    2: "\u3400"
    3: "\u3401"
    4: "\u3402"
    5: "\u3403"
    6: "\u3404"
    16: "\u4977"
    32: "\u4978"
  positive-spaces:
    1: "\u3410"
    2: "\u3411"
    4: "\u3412"
    8: "\u3413"
    16: "\u3414"
    32: "\u3415"

# ----------------------------------------------------------------------
#  BLOCCHI CUSTOM (note block)
#  Segnaposto per item-name e lore: %number% %variant% %health%
# ----------------------------------------------------------------------
blocks:
  max: 114                     # fino a che numero si ottiene con /bm getblock N-1
                               # (con i soli note block il massimo possibile e' 114)
  item-name: "&e&lBlocco %number%"
  lore:
    - ""
    - "&7blocco resistente, si distrugge"
    - "&7a colpi di palla di neve"
    - ""
    - "&8• &7vita &a%health%"
    - "&8• &7codice &f%variant%"
  drop-on-destroy: false       # true = quando la vita arriva a 0 il blocco lascia l'oggetto
  health:
    base: 1000                 # vita del blocco 1
    increase-percent: 50       # ogni blocco ha il 50% di vita in piu' (1000, 1500, 2000...)
    mode: linear               # linear = +50% della base (1000, 1500, 2000)
                               # compound = +50% del precedente (1000, 1500, 2250)
    overrides: {}              # per forzare la vita di un blocco, ad esempio  3: 5000

# ----------------------------------------------------------------------
#  EFFETTI quando una palla colpisce un blocco
#  sound: nome del suono di Minecraft (vuoto = nessun suono)
# ----------------------------------------------------------------------
effects:
  hit:
    particles: 8
    sound: "block.stone.hit"
    volume: 1.0
    pitch: 1.0
  destroy:
    particles: 40
    sound: "block.stone.break"
    volume: 1.0
    pitch: 1.0
