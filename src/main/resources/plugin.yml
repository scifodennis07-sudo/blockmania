name: BlockMania
version: 1.53.0
main: it.blockmania.BlockMania
api-version: '1.21'
description: Oggetti speciali con modello custom
commands:
  blockmania:
    description: Comandi di BlockMania
    usage: /<command> get <oggetto> [giocatore]
    aliases: [bm]
  tutorial:
    description: Denny e Andrew (NPC animati)
    usage: /<command> [skip]
  adminmania:
    description: Comandi dello staff di BlockMania
    usage: /<command> help | userprofile <nome>
    aliases: [am]
  ticket:
    description: Apre i tuoi ticket (assistenza, bug, segnalazioni)
    usage: /<command>
  mines:
    description: Apre la GUI delle miniere
    usage: /<command>
    aliases: [miniere]
permissions:
  blockmania.get:
    description: Permette di ottenere gli oggetti
    default: op
  blockmania.reload:
    description: Permette di ricaricare il config
    default: op
  blockmania.stats:
    description: Permette di gestire palle, blockshell e blockcoin
    default: op
  blockmania.shop.edit:
    description: Permette di creare e rompere i negozi
    default: op
  blockmania.build:
    description: Permette di usare la bacchetta e i comandi set, replace, remove e undo dei blocchi
    default: op
  blockmania.limits:
    description: Permette di togliere o rimettere le limitazioni (potenziamenti e attacco potenziato)
    default: op
  blockmania.break:
    description: Permette di rompere a mano i blocchi custom
    default: op
  blockmania.tutorial:
    description: Permette di vedere il tutorial
    default: true
  blockmania.tutorial.admin:
    description: Permette di impostare il tutorial (spot, punti, NPC)
    default: op
  blockmania.use:
    description: Permette di usare gli oggetti
    default: true
  blockmania.role.jr-helper:
    description: Ruolo staff jr-helper
    default: false
  blockmania.role.helper:
    description: Ruolo staff helper
    default: false
  blockmania.role.jr-mod:
    description: Ruolo staff jr-mod
    default: false
  blockmania.role.mod:
    description: Ruolo staff mod
    default: false
  blockmania.role.sr-mod:
    description: Ruolo staff sr-mod
    default: false
  blockmania.role.jr-admin:
    description: Ruolo staff jr-admin
    default: false
  blockmania.role.admin:
    description: Ruolo staff admin
    default: false
  blockmania.role.sr-admin:
    description: Ruolo staff sr-admin
    default: false
  blockmania.role.co-founder:
    description: Ruolo staff co-founder
    default: false
  blockmania.role.founder:
    description: Ruolo staff founder
    default: false
  blockmania.dept.builder:
    description: Reparto builder
    default: false
  blockmania.dept.texturemaker:
    description: Reparto texturemaker
    default: false
  blockmania.dept.developer:
    description: Reparto developer
    default: false
