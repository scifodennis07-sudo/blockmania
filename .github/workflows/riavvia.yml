name: Riavvia
on:
  workflow_dispatch:
jobs:
  riavvia:
    runs-on: ubuntu-latest
    steps:
      - name: Riavvia il server Falix
        env:
          FALIX_API_KEY: ${{ secrets.FALIX_API_KEY }}
        run: |
          for s in restart start; do
            code=$(curl -s -o out.txt -w '%{http_code}' -X POST "https://client.falixnodes.net/api/v2/servers/3441159/power" \
              -H "Authorization: Bearer $FALIX_API_KEY" -H "Content-Type: application/json" \
              -d "{\"signal\": \"$s\"}")
            echo "$s -> HTTP $code"; cat out.txt; echo
            [ "$code" = "202" ] && exit 0
          done
          exit 1
