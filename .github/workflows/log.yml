name: Log
on: workflow_dispatch
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica log dal server Falix
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SFTP_KEY }}" > ~/.ssh/falix_key
          chmod 600 ~/.ssh/falix_key
          ssh-keyscan -p 3928 eu11-free.falixserver.net >> ~/.ssh/known_hosts 2>/dev/null
          echo "get logs/latest.log latest.log" > batch.txt
          sftp -P 3928 -i ~/.ssh/falix_key -b batch.txt scifodennis07.1aeee6eb@eu11-free.falixserver.net
          echo "=====LOG====="
          tail -n 300 latest.log
          echo "=====FINE====="
