name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: BlockMania
          path: target/BlockMania.jar
      - name: Carica il jar sul server Falix
        if: github.ref == 'refs/heads/main'
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/falix_key
          chmod 600 ~/.ssh/falix_key
          ssh-keyscan -p 3928 eu11-free.falixserver.net >> ~/.ssh/known_hosts
          echo "put target/BlockMania.jar plugins/BlockMania.jar" > batch.txt
          sftp -P 3928 -i ~/.ssh/falix_key -b batch.txt scifodennis07.1aeee6eb@eu11-free.falixserver.net
