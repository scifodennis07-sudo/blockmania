name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: BlockMania
          path: target/BlockMania.jar
      - name: Carica il jar sul server Falix
        if: github.ref == 'refs/heads/main'
        env:
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          FALIX_API_KEY: ${{ secrets.FALIX_API_KEY }}
        run: |
          API=https://client.falixnodes.net/api/v2/servers/3441159
          echo "== dati SFTP secondo Falix =="
          curl -s "$API/sftp" -H "Authorization: Bearer $FALIX_API_KEY" | jq -c '.' || true
          mkdir -p ~/.ssh
          printf '%s\n' "$SFTP_KEY" > ~/.ssh/falix_key
          chmod 600 ~/.ssh/falix_key
          ssh-keyscan -p 3928 eu11-free.falixserver.net >> ~/.ssh/known_hosts 2>/dev/null || true
          printf -- '-mkdir plugins/update\nput target/BlockMania.jar plugins/update/BlockMania.jar\n' > batch.txt
          if sftp -P 3928 -i ~/.ssh/falix_key -b batch.txt scifodennis07.1aeee6eb@eu11-free.falixserver.net; then
            echo "caricato via SFTP"; exit 0
          fi
          echo "== SFTP rifiutato: provo con le API Falix =="
          curl -s -X POST "$API/files/create-folder" -H "Authorization: Bearer $FALIX_API_KEY" -H "Content-Type: application/json" \
            -d '{"root":"/plugins","name":"update"}' > /dev/null || true
          resp=$(curl -s -X POST "$API/files/upload" -H "Authorization: Bearer $FALIX_API_KEY")
          echo "$resp" | jq -c 'del(..|.url?)' 2>/dev/null || true
          url=$(echo "$resp" | jq -r '[..|strings|select(startswith("http") and (contains("apidocs")|not))][0] // empty')
          if [ -z "$url" ] || [ "$url" = "null" ]; then echo "nessun URL di upload"; echo "$resp" | head -c 300; exit 1; fi
          case "$url" in *\?*) sep='&';; *) sep='?';; esac
          code=$(curl -s -o up.txt -w '%{http_code}' -X POST "${url}${sep}directory=/plugins/update" -F "files=@target/BlockMania.jar")
          echo "upload: $code"; head -c 300 up.txt; echo
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
